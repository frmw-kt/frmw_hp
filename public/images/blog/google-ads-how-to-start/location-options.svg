<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <title>地域ターゲティングの「所在地」と「所在地やインタレスト」で広告が表示される人の違い</title>
  <desc>対象地域を横浜市にした場合。「所在地」は横浜市にいる人・よく訪れる人にだけ表示し、地域外の人には表示しない。「所在地やインタレスト」（初期設定・推奨）は、それに加えて横浜市に関心を示した地域外の人にも表示する。横浜市はGoogle 広告ヘルプの例。</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <line x1="400" y1="20" x2="400" y2="420" stroke="#e3e2dc" stroke-width="2"/>

  <text x="205" y="50" font-size="26" font-weight="700" fill="#191c19" text-anchor="middle">所在地</text>
  <text x="205" y="80" font-size="22" fill="#41483c" text-anchor="middle">（絞り込む設定）</text>
  <circle cx="190" cy="205" r="95" fill="#f7f7f4" stroke="#c9a84c" stroke-width="3"/>
  <text x="190" y="165" font-size="24" font-weight="700" fill="#191c19" text-anchor="middle">横浜市</text>
  <circle cx="160" cy="210" r="13" fill="#806222"/>
  <circle cx="215" cy="225" r="13" fill="#806222"/>
  <circle cx="185" cy="258" r="13" fill="#806222"/>
  <circle cx="340" cy="290" r="13" fill="#ffffff" stroke="#9a9a92" stroke-width="3"/>
  <text x="340" y="330" font-size="22" fill="#41483c" text-anchor="middle">地域外</text>
  <text x="30" y="378" font-size="22" fill="#191c19">表示：地域にいる・よく訪れる人</text>
  <text x="30" y="410" font-size="22" fill="#41483c">地域外の人には表示しない</text>

  <text x="600" y="50" font-size="26" font-weight="700" fill="#191c19" text-anchor="middle">所在地やインタレスト</text>
  <text x="600" y="80" font-size="22" fill="#41483c" text-anchor="middle">（初期設定・推奨）</text>
  <circle cx="585" cy="205" r="95" fill="#f7f7f4" stroke="#c9a84c" stroke-width="3"/>
  <text x="585" y="165" font-size="24" font-weight="700" fill="#191c19" text-anchor="middle">横浜市</text>
  <circle cx="555" cy="210" r="13" fill="#806222"/>
  <circle cx="610" cy="225" r="13" fill="#806222"/>
  <circle cx="580" cy="258" r="13" fill="#806222"/>
  <circle cx="738" cy="290" r="13" fill="#806222"/>
  <text x="738" y="330" font-size="22" fill="#41483c" text-anchor="middle">地域外</text>
  <text x="420" y="378" font-size="22" fill="#191c19">表示：左に加え、関心を示した人</text>
  <text x="420" y="410" font-size="22" fill="#41483c">横浜市のパン屋を調べた人など</text>

  <text x="30" y="458" font-size="22" fill="#41483c">※横浜市のパン屋は Google 広告ヘルプの例</text>
</svg>
