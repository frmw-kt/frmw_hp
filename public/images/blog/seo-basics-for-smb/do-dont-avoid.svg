<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect x="0" y="0" width="800" height="440" fill="#f7f7f4"/>
  <rect x="16" y="16" width="252" height="408" rx="8" fill="#ffffff" stroke="#806222" stroke-width="3"/>
  <rect x="16" y="16" width="252" height="64" rx="8" fill="#806222"/>
  <text x="142" y="58" font-size="26" fill="#ffffff" font-weight="bold" text-anchor="middle">やること</text>
