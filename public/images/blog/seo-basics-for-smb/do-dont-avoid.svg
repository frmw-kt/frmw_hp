  <text x="400" y="58" font-size="24" fill="#191c19" font-weight="bold" text-anchor="middle">やらなくてよいこと</text>
  <text x="290" y="130" font-size="22" fill="#191c19">メタキーワード</text>
  <text x="290" y="190" font-size="22" fill="#191c19">文字数の調整</text>
  <text x="290" y="250" font-size="22" fill="#191c19">見出しの数・順序</text>
