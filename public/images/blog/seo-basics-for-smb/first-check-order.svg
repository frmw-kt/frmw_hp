<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect x="0" y="0" width="800" height="640" fill="#f7f7f4"/>
  <rect x="30" y="20" width="440" height="100" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="50" y="60" font-size="24" fill="#191c19">1. Googleで「site:自社の</text>
  <text x="50" y="96" font-size="24" fill="#191c19">ドメイン」を検索する</text>
  <path d="M470 70 L540 70" stroke="#c9a84c" stroke-width="4"/>
  <polygon points="538,60 538,80 552,70" fill="#c9a84c"/>
  <text x="478" y="56" font-size="22" fill="#41483c">出ない</text>
  <rect x="552" y="20" width="230" height="208" rx="8" fill="#ffffff" stroke="#806222" stroke-width="3"/>
  <text x="568" y="60" font-size="22" fill="#806222" font-weight="bold">技術要件の3つ</text>
  <text x="568" y="100" font-size="22" fill="#191c19">・ブロックなし</text>
  <text x="568" y="140" font-size="22" fill="#191c19">・200を返す</text>
  <text x="568" y="180" font-size="22" fill="#191c19">・登録できる</text>
  <text x="568" y="212" font-size="22" fill="#191c19">　中身がある</text>
  <path d="M667 230 L667 290 L480 290" stroke="#c9a84c" stroke-width="4" fill="none"/>
  <polygon points="482,280 482,300 468,290" fill="#c9a84c"/>
  <path d="M250 122 L250 158" stroke="#c9a84c" stroke-width="4"/>
  <polygon points="240,156 260,156 250,168" fill="#c9a84c"/>
  <text x="264" y="152" font-size="22" fill="#41483c">出る</text>
  <rect x="30" y="168" width="440" height="150" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="50" y="208" font-size="24" fill="#191c19">2. Search Consoleで</text>
  <text x="50" y="244" font-size="24" fill="#191c19">サイトの所有者を確認し、</text>
  <text x="50" y="280" font-size="24" fill="#191c19">URL検査で見え方を確かめる</text>
  <path d="M250 320 L250 356" stroke="#c9a84c" stroke-width="4"/>
  <polygon points="240,354 260,354 250,366" fill="#c9a84c"/>
  <rect x="30" y="366" width="440" height="110" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="50" y="408" font-size="24" fill="#191c19">3. ページのエラーを直す</text>
  <text x="50" y="444" font-size="24" fill="#191c19">（サイトマップは任意）</text>
  <path d="M250 478 L250 514" stroke="#c9a84c" stroke-width="4"/>
  <polygon points="240,512 260,512 250,524" fill="#c9a84c"/>
  <rect x="30" y="524" width="440" height="100" rx="8" fill="#806222"/>
  <text x="50" y="566" font-size="24" fill="#ffffff" font-weight="bold">4. 検索パフォーマンスを</text>
  <text x="50" y="602" font-size="24" fill="#ffffff" font-weight="bold">月1回程度見る</text>
  <text x="510" y="420" font-size="22" fill="#41483c">ここまで終われば、</text>
  <text x="510" y="456" font-size="22" fill="#41483c">ページの中身の</text>
  <text x="510" y="492" font-size="22" fill="#41483c">改善に進む</text>
</svg>
