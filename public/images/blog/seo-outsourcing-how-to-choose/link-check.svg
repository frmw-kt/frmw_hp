<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect x="0" y="0" width="800" height="560" fill="#f7f7f4"/>
  <rect x="30" y="20" width="740" height="100" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="50" y="60" font-size="24" fill="#191c19">リンクと引き換えに、お金・物品・サービスを</text>
  <text x="50" y="96" font-size="24" fill="#191c19">やり取りしている？</text>
  <path d="M200 122 L200 158" stroke="#c9a84c" stroke-width="4"/>
  <polygon points="190,156 210,156 200,168" fill="#c9a84c"/>
  <text x="212" y="150" font-size="22" fill="#806222" font-weight="bold">はい</text>
  <path d="M600 122 L600 158" stroke="#c9a84c" stroke-width="4"/>
  <polygon points="590,156 610,156 600,168" fill="#c9a84c"/>
  <text x="612" y="150" font-size="22" fill="#41483c">いいえ</text>
  <rect x="30" y="168" width="360" height="136" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="50" y="208" font-size="24" fill="#191c19">リンクに rel="sponsored"</text>
  <text x="50" y="244" font-size="24" fill="#191c19">か rel="nofollow" が</text>
  <text x="50" y="280" font-size="24" fill="#191c19">付いている？</text>
  <rect x="410" y="168" width="360" height="136" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="430" y="208" font-size="24" fill="#191c19">自動作成・過剰な相互</text>
  <text x="430" y="244" font-size="24" fill="#191c19">リンク・質の低い登録</text>
  <text x="430" y="280" font-size="24" fill="#191c19">サイトで作ったリンク？</text>
  <path d="M110 306 L110 362" stroke="#c9a84c" stroke-width="4"/>
  <polygon points="100,360 120,360 110,372" fill="#c9a84c"/>
  <text x="122" y="346" font-size="22" fill="#41483c">はい</text>
  <path d="M300 306 L300 362" stroke="#c9a84c" stroke-width="4"/>
  <polygon points="290,360 310,360 300,372" fill="#c9a84c"/>
  <text x="312" y="346" font-size="22" fill="#806222" font-weight="bold">いいえ</text>
  <path d="M500 306 L500 362" stroke="#c9a84c" stroke-width="4"/>
  <polygon points="490,360 510,360 500,372" fill="#c9a84c"/>
  <text x="512" y="346" font-size="22" fill="#806222" font-weight="bold">はい</text>
  <path d="M690 306 L690 362" stroke="#c9a84c" stroke-width="4"/>
  <polygon points="680,360 700,360 690,372" fill="#c9a84c"/>
  <text x="702" y="346" font-size="22" fill="#41483c">いいえ</text>
  <rect x="30" y="372" width="170" height="160" rx="8" fill="#ffffff" stroke="#806222" stroke-width="3"/>
  <text x="46" y="414" font-size="24" fill="#806222" font-weight="bold">広告の目的</text>
  <text x="46" y="450" font-size="24" fill="#806222" font-weight="bold">なら違反に</text>
  <text x="46" y="486" font-size="24" fill="#806222" font-weight="bold">ならない</text>
  <rect x="210" y="372" width="180" height="160" rx="8" fill="#806222"/>
  <text x="226" y="414" font-size="24" fill="#ffffff" font-weight="bold">リンク</text>
  <text x="226" y="450" font-size="24" fill="#ffffff" font-weight="bold">スパムの例</text>
  <text x="226" y="486" font-size="24" fill="#ffffff" font-weight="bold">にあたる</text>
  <rect x="410" y="372" width="180" height="160" rx="8" fill="#806222"/>
  <text x="426" y="414" font-size="24" fill="#ffffff" font-weight="bold">リンク</text>
  <text x="426" y="450" font-size="24" fill="#ffffff" font-weight="bold">スパムの例</text>
  <text x="426" y="486" font-size="24" fill="#ffffff" font-weight="bold">にあたる</text>
  <rect x="600" y="372" width="170" height="160" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="616" y="414" font-size="24" fill="#191c19">ポリシーの</text>
  <text x="616" y="450" font-size="24" fill="#191c19">例には</text>
  <text x="616" y="486" font-size="24" fill="#191c19">あたらない</text>
</svg>
