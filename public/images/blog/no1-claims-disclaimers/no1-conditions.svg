<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="560" fill="#f7f7f4"/>
  <rect x="200" y="28" width="400" height="76" rx="10" fill="#191c19"/>
  <text x="400" y="66" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">「顧客満足度No.1」の根拠</text>
  <text x="400" y="94" font-size="22" fill="#c9a84c" text-anchor="middle">第三者の主観的評価が指標</text>
  <line x1="400" y1="104" x2="400" y2="134" stroke="#806222" stroke-width="3"/>
  <g>
    <rect x="40" y="140" width="720" height="78" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
    <circle cx="86" cy="179" r="24" fill="#c9a84c"/>
    <text x="86" y="188" font-size="26" fill="#191c19" text-anchor="middle" font-weight="bold">1</text>
    <text x="130" y="188" font-size="26" fill="#191c19">比較する商品等が適切に選ばれている</text>
  </g>
  <g>
    <rect x="40" y="232" width="720" height="78" rx="8" fill="#ffffff" stroke="#806222" stroke-width="3"/>
    <circle cx="86" cy="271" r="24" fill="#c9a84c"/>
    <text x="86" y="280" font-size="26" fill="#191c19" text-anchor="middle" font-weight="bold">2</text>
    <text x="130" y="280" font-size="26" fill="#191c19">調査対象者が適切に選ばれている</text>
  </g>
  <g>
    <rect x="40" y="324" width="720" height="78" rx="8" fill="#ffffff" stroke="#806222" stroke-width="3"/>
    <circle cx="86" cy="363" r="24" fill="#c9a84c"/>
    <text x="86" y="372" font-size="26" fill="#191c19" text-anchor="middle" font-weight="bold">3</text>
    <text x="130" y="372" font-size="26" fill="#191c19">調査が公平な方法で行われている</text>
  </g>
  <g>
    <rect x="40" y="416" width="720" height="78" rx="8" fill="#ffffff" stroke="#806222" stroke-width="3"/>
    <circle cx="86" cy="455" r="24" fill="#c9a84c"/>
    <text x="86" y="464" font-size="26" fill="#191c19" text-anchor="middle" font-weight="bold">4</text>
    <text x="130" y="464" font-size="26" fill="#191c19">表示内容と調査結果が対応している</text>
  </g>
  <text x="400" y="534" font-size="24" fill="#41483c" text-anchor="middle">太枠の2〜4は「医師の◯%が推奨」などの高評価%表示にも必要</text>
</svg>
