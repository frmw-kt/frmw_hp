<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="680" fill="#f7f7f4"/>
  <text x="205" y="44" font-size="26" fill="#191c19" text-anchor="middle" font-weight="bold">見落とされやすい配置</text>
  <text x="595" y="44" font-size="26" fill="#806222" text-anchor="middle" font-weight="bold">一体で認識しやすい配置</text>
  <!-- left phone -->
  <rect x="40" y="64" width="330" height="596" rx="28" fill="#ffffff" stroke="#191c19" stroke-width="3"/>
  <text x="205" y="130" font-size="40" fill="#191c19" text-anchor="middle" font-weight="bold">4,800円※</text>
  <rect x="70" y="160" width="270" height="64" rx="32" fill="#c9a84c"/>
  <text x="205" y="202" font-size="26" fill="#191c19" text-anchor="middle" font-weight="bold">今すぐ申し込む</text>
  <text x="205" y="264" font-size="22" fill="#41483c" text-anchor="middle">（ボタンで注文フォームへ）</text>
  <rect x="70" y="290" width="270" height="60" rx="6" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="86" y="329" font-size="24" fill="#191c19">よくある質問　＋</text>
  <text x="205" y="384" font-size="22" fill="#41483c" text-anchor="middle">（開かないと条件が見えない）</text>
  <text x="205" y="452" font-size="24" fill="#41483c" text-anchor="middle">⋮　スクロール　⋮</text>
  <line x1="70" y1="540" x2="340" y2="540" stroke="#e3e2dc" stroke-width="2"/>
  <text x="80" y="580" font-size="22" fill="#41483c">※初回のみ。2回目以降は</text>
  <text x="80" y="610" font-size="22" fill="#41483c">定期購入の条件あり</text>
  <!-- right phone -->
  <rect x="430" y="64" width="330" height="596" rx="28" fill="#ffffff" stroke="#806222" stroke-width="3"/>
  <text x="595" y="128" font-size="28" fill="#191c19" text-anchor="middle" font-weight="bold">初めてご購入の方に限り</text>
  <text x="595" y="184" font-size="40" fill="#191c19" text-anchor="middle" font-weight="bold">1箱4,800円</text>
  <rect x="456" y="210" width="278" height="110" rx="6" fill="#f7f7f4"/>
  <text x="470" y="250" font-size="22" fill="#191c19">2回目以降の条件を</text>
  <text x="470" y="290" font-size="22" fill="#191c19">同じ画面に同じ大きさで</text>
  <rect x="460" y="350" width="270" height="64" rx="32" fill="#c9a84c"/>
  <text x="595" y="392" font-size="26" fill="#191c19" text-anchor="middle" font-weight="bold">条件を見て申し込む</text>
  <text x="595" y="470" font-size="24" fill="#41483c" text-anchor="middle">条件はボタンより上</text>
  <text x="595" y="510" font-size="24" fill="#41483c" text-anchor="middle">アコーディオンに入れない</text>
  <text x="595" y="590" font-size="22" fill="#41483c" text-anchor="middle">（価格・条件は架空の例）</text>
</svg>
