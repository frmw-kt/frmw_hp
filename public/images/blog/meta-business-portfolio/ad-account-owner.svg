<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="560" fill="#ffffff"/>
  <text x="200" y="40" font-size="26" font-weight="bold" fill="#191c19" text-anchor="middle">自社のポートフォリオで作る</text>
  <text x="600" y="40" font-size="26" font-weight="bold" fill="#191c19" text-anchor="middle">代理店のポートフォリオで作る</text>
  <rect x="20" y="60" width="360" height="200" rx="8" fill="#f7f7f4" stroke="#c9a84c" stroke-width="3"/>
  <text x="200" y="100" font-size="24" fill="#191c19" text-anchor="middle">自社のポートフォリオ</text>
  <rect x="60" y="120" width="280" height="56" rx="6" fill="#191c19"/>
  <text x="200" y="157" font-size="24" fill="#ffffff" text-anchor="middle">広告アカウント</text>
  <text x="200" y="218" font-size="22" fill="#41483c" text-anchor="middle">代理店にはパートナーとして</text>
  <text x="200" y="246" font-size="22" fill="#41483c" text-anchor="middle">アクセスを渡す</text>
  <rect x="420" y="60" width="360" height="200" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="600" y="100" font-size="24" fill="#191c19" text-anchor="middle">代理店のポートフォリオ</text>
  <rect x="460" y="120" width="280" height="56" rx="6" fill="#191c19"/>
  <text x="600" y="157" font-size="24" fill="#ffffff" text-anchor="middle">広告アカウント</text>
  <text x="600" y="218" font-size="22" fill="#41483c" text-anchor="middle">自社はアクセスの共有を</text>
  <text x="600" y="246" font-size="22" fill="#41483c" text-anchor="middle">受ける側になる</text>
  <polygon points="190,280 210,280 200,300" fill="#c9a84c"/>
  <polygon points="590,280 610,280 600,300" fill="#c9a84c"/>
  <text x="400" y="340" font-size="24" font-weight="bold" fill="#191c19" text-anchor="middle">代理店との契約が終わったとき</text>
  <rect x="20" y="360" width="360" height="130" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="200" y="405" font-size="24" fill="#191c19" text-anchor="middle">パートナーを削除する</text>
  <text x="200" y="440" font-size="24" fill="#191c19" text-anchor="middle">広告アカウントは</text>
  <text x="200" y="473" font-size="24" fill="#806222" font-weight="bold" text-anchor="middle">自社に所属したまま</text>
  <rect x="420" y="360" width="360" height="130" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="600" y="405" font-size="24" fill="#191c19" text-anchor="middle">広告アカウントを</text>
  <text x="600" y="440" font-size="24" fill="#191c19" text-anchor="middle">自社のポートフォリオへ</text>
  <text x="600" y="473" font-size="24" fill="#806222" font-weight="bold" text-anchor="middle">移せない</text>
  <text x="20" y="535" font-size="22" fill="#41483c">ポートフォリオで新しく作った広告アカウントは、削除も移動もできない</text>
</svg>
