<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="600" fill="#ffffff"/>
  <text x="20" y="38" font-size="24" font-weight="bold" fill="#191c19">確かめる順</text>
  <text x="470" y="38" font-size="24" font-weight="bold" fill="#191c19">当てはまったときの対処</text>
  <rect x="20" y="56" width="400" height="88" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="40" y="94" font-size="24" fill="#191c19">1 自分に全権限がない</text>
  <text x="40" y="126" font-size="22" fill="#41483c">［パートナー］が表示されない</text>
  <rect x="470" y="56" width="310" height="88" rx="8" fill="#191c19"/>
  <text x="490" y="94" font-size="22" fill="#ffffff">全権限を持つ自社の人が</text>
  <text x="490" y="126" font-size="22" fill="#ffffff">操作する</text>
  <rect x="20" y="164" width="400" height="88" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="40" y="202" font-size="24" fill="#191c19">2 代理店のIDが違う</text>
  <text x="40" y="234" font-size="22" fill="#41483c">相手にポートフォリオがない</text>
  <rect x="470" y="164" width="310" height="88" rx="8" fill="#191c19"/>
  <text x="490" y="202" font-size="22" fill="#ffffff">相手の［設定］の</text>
  <text x="490" y="234" font-size="22" fill="#ffffff">番号を確かめてもらう</text>
  <rect x="20" y="272" width="400" height="88" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="40" y="310" font-size="24" fill="#191c19">3 二段階認証が無効</text>
  <text x="40" y="342" font-size="22" fill="#41483c">ポートフォリオの設定</text>
  <rect x="470" y="272" width="310" height="88" rx="8" fill="#191c19"/>
  <text x="490" y="310" font-size="22" fill="#ffffff">有効にしてから</text>
  <text x="490" y="342" font-size="22" fill="#ffffff">追加し直す</text>
  <rect x="20" y="380" width="400" height="88" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="40" y="418" font-size="24" fill="#191c19">4 別の人の承認待ち</text>
  <text x="40" y="450" font-size="22" fill="#41483c">全権限を持つ2人目</text>
  <rect x="470" y="380" width="310" height="88" rx="8" fill="#191c19"/>
  <text x="490" y="418" font-size="22" fill="#ffffff">2人目に承認を</text>
  <text x="490" y="450" font-size="22" fill="#ffffff">依頼する</text>
  <rect x="20" y="488" width="400" height="88" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="40" y="526" font-size="24" fill="#191c19">5 アセットが別の所属</text>
  <text x="40" y="558" font-size="22" fill="#41483c">ページ・Instagramなど</text>
  <rect x="470" y="488" width="310" height="88" rx="8" fill="#191c19"/>
  <text x="490" y="526" font-size="22" fill="#ffffff">所有者に削除か</text>
  <text x="490" y="558" font-size="22" fill="#ffffff">共有を頼む</text>
  <polygon points="428,90 428,110 458,100" fill="#c9a84c"/>
  <polygon points="428,198 428,218 458,208" fill="#c9a84c"/>
  <polygon points="428,306 428,326 458,316" fill="#c9a84c"/>
  <polygon points="428,414 428,434 458,424" fill="#c9a84c"/>
  <polygon points="428,522 428,542 458,532" fill="#c9a84c"/>
</svg>
