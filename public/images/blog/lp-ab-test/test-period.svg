<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect x="0" y="0" width="800" height="420" fill="#f7f7f4"/>
  <text x="400" y="44" font-size="26" fill="#191c19" text-anchor="middle" font-weight="bold">媒体のテスト機能が示す期間の目安</text>
  <!-- scale: week 0 at x=180, 6 weeks at x=760 ; 1 week = 96.7px -->
  <line x1="180" y1="350" x2="760" y2="350" stroke="#41483c" stroke-width="2"/>
  <text x="180" y="384" font-size="22" fill="#41483c" text-anchor="middle">0</text>
  <text x="277" y="384" font-size="22" fill="#41483c" text-anchor="middle">1週</text>
  <text x="373" y="384" font-size="22" fill="#41483c" text-anchor="middle">2週</text>
  <text x="470" y="384" font-size="22" fill="#41483c" text-anchor="middle">3週</text>
  <text x="567" y="384" font-size="22" fill="#41483c" text-anchor="middle">4週</text>
  <text x="663" y="384" font-size="22" fill="#41483c" text-anchor="middle">5週</text>
  <text x="760" y="384" font-size="22" fill="#41483c" text-anchor="middle">6週</text>
  <text x="20" y="110" font-size="24" fill="#191c19" font-weight="bold">Meta</text>
  <rect x="180" y="86" width="96" height="40" fill="#e3e2dc"/>
  <rect x="277" y="86" width="317" height="40" fill="#c9a84c"/>
  <text x="435" y="114" font-size="22" fill="#191c19" text-anchor="middle" font-weight="bold">7日以上を推奨（設定は最大30日）</text>
  <text x="20" y="196" font-size="24" fill="#191c19" font-weight="bold">Google</text>
  <rect x="373" y="172" width="194" height="40" fill="#c9a84c"/>
  <text x="470" y="200" font-size="22" fill="#191c19" text-anchor="middle" font-weight="bold">2〜3週間</text>
  <text x="580" y="200" font-size="22" fill="#41483c">データを集める</text>
  <text x="20" y="276" font-size="24" fill="#191c19" font-weight="bold">Google</text>
  <rect x="567" y="252" width="193" height="40" fill="#806222"/>
  <text x="663" y="280" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">4〜6週間以上</text>
  <text x="550" y="320" font-size="22" fill="#41483c" text-anchor="end">結果が「未定」のとき</text>
</svg>
