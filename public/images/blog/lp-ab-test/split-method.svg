<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect x="0" y="0" width="800" height="470" fill="#f7f7f4"/>
  <text x="400" y="44" font-size="26" fill="#191c19" text-anchor="middle" font-weight="bold">比べたい流入の範囲で、分け方を選ぶ</text>
  <rect x="180" y="74" width="440" height="80" rx="10" fill="#191c19"/>
  <text x="400" y="122" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">比べたいのは広告からの流入だけか</text>
  <line x1="290" y1="154" x2="200" y2="200" stroke="#806222" stroke-width="4"/>
  <line x1="510" y1="154" x2="600" y2="200" stroke="#806222" stroke-width="4"/>
  <text x="215" y="186" font-size="22" fill="#806222" font-weight="bold">はい</text>
  <text x="560" y="186" font-size="22" fill="#806222" font-weight="bold">いいえ</text>
  <rect x="20" y="206" width="360" height="200" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="200" y="248" font-size="24" fill="#191c19" text-anchor="middle" font-weight="bold">媒体のテスト機能</text>
  <text x="200" y="290" font-size="22" fill="#41483c" text-anchor="middle">Google：カスタムテスト</text>
  <text x="200" y="326" font-size="22" fill="#41483c" text-anchor="middle">Meta：A/Bテスト</text>
  <text x="200" y="370" font-size="22" fill="#41483c" text-anchor="middle">広告のリンク先を変えて比べる</text>
  <rect x="420" y="206" width="360" height="200" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="600" y="248" font-size="24" fill="#191c19" text-anchor="middle" font-weight="bold">LPのテストツール</text>
  <text x="600" y="290" font-size="22" fill="#41483c" text-anchor="middle">同じURLで表示を分ける</text>
  <text x="600" y="326" font-size="22" fill="#41483c" text-anchor="middle">または302で振り分け</text>
  <text x="600" y="370" font-size="22" fill="#41483c" text-anchor="middle">別URLはcanonicalを付ける</text>
  <text x="400" y="448" font-size="22" fill="#41483c" text-anchor="middle">自然検索の流入も含むなら、検索への影響を避ける設定が必要</text>
</svg>
