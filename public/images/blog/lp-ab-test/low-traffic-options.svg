<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect x="0" y="0" width="800" height="560" fill="#f7f7f4"/>
  <text x="400" y="44" font-size="26" fill="#191c19" text-anchor="middle" font-weight="bold">件数に届くかで、テストか代わりの方法かを選ぶ</text>
  <rect x="100" y="70" width="600" height="96" rx="10" fill="#191c19"/>
  <text x="400" y="110" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">必要な訪問数に、媒体の目安の</text>
  <text x="400" y="146" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">期間（4〜6週間）で届くか</text>
  <line x1="250" y1="166" x2="160" y2="210" stroke="#806222" stroke-width="4"/>
  <line x1="550" y1="166" x2="560" y2="210" stroke="#806222" stroke-width="4"/>
  <text x="170" y="196" font-size="22" fill="#806222" font-weight="bold">届く</text>
  <text x="580" y="196" font-size="22" fill="#806222" font-weight="bold">届かない</text>
  <rect x="20" y="216" width="250" height="120" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="4"/>
  <text x="145" y="266" font-size="24" fill="#191c19" text-anchor="middle" font-weight="bold">A/Bテスト</text>
  <text x="145" y="304" font-size="22" fill="#41483c" text-anchor="middle">成果の件数で判定</text>
  <rect x="300" y="216" width="480" height="68" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="320" y="259" font-size="22" fill="#191c19">1 誤り・不具合はテストせず直す</text>
  <rect x="300" y="294" width="480" height="68" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="320" y="337" font-size="22" fill="#191c19">2 差が大きく出る案に変える</text>
  <rect x="300" y="372" width="480" height="68" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="320" y="415" font-size="22" fill="#191c19">3 手前の指標（クリック等）で比べる</text>
  <rect x="300" y="450" width="480" height="68" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="320" y="493" font-size="22" fill="#191c19">4 同じ日数の前後で比べる</text>
  <text x="145" y="400" font-size="22" fill="#41483c" text-anchor="middle">2〜3で届けば</text>
  <text x="145" y="434" font-size="22" fill="#41483c" text-anchor="middle">A/Bテストに戻る</text>
</svg>
