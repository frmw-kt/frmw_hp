<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="590" fill="#f7f7f4"/>
  <!-- 見出し -->
  <rect x="20" y="20" width="370" height="56" rx="8" fill="#191c19"/>
  <text x="205" y="57" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Google広告の検索広告</text>
  <rect x="410" y="20" width="370" height="56" rx="8" fill="#191c19"/>
  <text x="595" y="57" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Meta広告</text>
  <!-- 左：Google広告 -->
  <rect x="20" y="96" width="370" height="96" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="205" y="135" font-size="24" fill="#41483c" text-anchor="middle">ユーザーが</text>
  <text x="205" y="170" font-size="24" fill="#41483c" text-anchor="middle">Googleで検索する</text>
  <polygon points="191,200 219,200 205,216" fill="#c9a84c"/>
  <rect x="20" y="222" width="370" height="96" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="205" y="261" font-size="24" fill="#41483c" text-anchor="middle">検索語句とキーワードの</text>
  <text x="205" y="296" font-size="24" fill="#41483c" text-anchor="middle">関連性で広告を選ぶ</text>
  <polygon points="191,326 219,326 205,342" fill="#c9a84c"/>
  <rect x="20" y="348" width="370" height="96" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="205" y="387" font-size="24" fill="#41483c" text-anchor="middle">検索結果に</text>
  <text x="205" y="422" font-size="24" fill="#41483c" text-anchor="middle">テキスト広告を表示</text>
  <polygon points="191,452 219,452 205,468" fill="#c9a84c"/>
  <rect x="20" y="474" width="370" height="96" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="205" y="513" font-size="24" font-weight="bold" fill="#806222" text-anchor="middle">探している人に届く</text>
  <text x="205" y="548" font-size="24" font-weight="bold" fill="#806222" text-anchor="middle">（顕在層）</text>
  <!-- 右：Meta広告 -->
  <rect x="410" y="96" width="370" height="96" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="595" y="135" font-size="24" fill="#41483c" text-anchor="middle">広告セットで対象を決める</text>
  <text x="595" y="170" font-size="24" fill="#41483c" text-anchor="middle">（地域・年齢・興味・関心）</text>
  <polygon points="581,200 609,200 595,216" fill="#c9a84c"/>
  <rect x="410" y="222" width="370" height="96" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="595" y="261" font-size="24" fill="#41483c" text-anchor="middle">配信システム（AI）が</text>
  <text x="595" y="296" font-size="24" fill="#41483c" text-anchor="middle">反応しそうな人を選ぶ</text>
  <polygon points="581,326 609,326 595,342" fill="#c9a84c"/>
  <rect x="410" y="348" width="370" height="96" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="595" y="387" font-size="24" fill="#41483c" text-anchor="middle">フィードやストーリーズに</text>
  <text x="595" y="422" font-size="24" fill="#41483c" text-anchor="middle">画像・動画の広告を表示</text>
  <polygon points="581,452 609,452 595,468" fill="#c9a84c"/>
  <rect x="410" y="474" width="370" height="96" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="595" y="513" font-size="24" font-weight="bold" fill="#806222" text-anchor="middle">まだ探していない人にも</text>
  <text x="595" y="548" font-size="24" font-weight="bold" fill="#806222" text-anchor="middle">届く（潜在層を含む）</text>
</svg>
