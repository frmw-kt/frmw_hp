<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="680" fill="#f7f7f4"/>
  <!-- 問い -->
  <rect x="60" y="20" width="680" height="110" rx="10" fill="#191c19"/>
  <text x="400" y="66" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">顧客は自社の商品・サービスを</text>
  <text x="400" y="106" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">検索するか？</text>
  <!-- 確かめ方 -->
  <rect x="110" y="150" width="580" height="90" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="400" y="186" font-size="24" fill="#41483c" text-anchor="middle">確かめ方：キーワード プランナーで</text>
  <text x="400" y="222" font-size="24" fill="#41483c" text-anchor="middle">月間の検索数の見積もりを見る</text>
  <!-- 分岐 -->
  <path d="M400 240 L400 266 L210 266 L210 318" fill="none" stroke="#806222" stroke-width="3"/>
  <path d="M400 266 L590 266 L590 318" fill="none" stroke="#806222" stroke-width="3"/>
  <polygon points="196,316 224,316 210,334" fill="#806222"/>
  <polygon points="576,316 604,316 590,334" fill="#806222"/>
  <!-- 左：はい -->
  <rect x="30" y="340" width="360" height="180" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="210" y="378" font-size="24" font-weight="bold" fill="#806222" text-anchor="middle">はい</text>
  <text x="210" y="418" font-size="24" font-weight="bold" fill="#191c19" text-anchor="middle">Google広告の検索広告から</text>
  <text x="210" y="458" font-size="22" fill="#41483c" text-anchor="middle">例：「地域名＋業種」や</text>
  <text x="210" y="492" font-size="22" fill="#41483c" text-anchor="middle">商品名で探される</text>
  <!-- 右：いいえ・少ない -->
  <rect x="410" y="340" width="360" height="180" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="590" y="378" font-size="24" font-weight="bold" fill="#806222" text-anchor="middle">いいえ・少ない</text>
  <text x="590" y="418" font-size="24" font-weight="bold" fill="#191c19" text-anchor="middle">Meta広告から</text>
  <text x="590" y="458" font-size="22" fill="#41483c" text-anchor="middle">例：新しい商品・サービス、</text>
  <text x="590" y="492" font-size="22" fill="#41483c" text-anchor="middle">写真や動画で選ばれる</text>
  <!-- 合流 -->
  <line x1="210" y1="520" x2="210" y2="552" stroke="#806222" stroke-width="3"/>
  <line x1="590" y1="520" x2="590" y2="552" stroke="#806222" stroke-width="3"/>
  <polygon points="196,550 224,550 210,568" fill="#806222"/>
  <polygon points="576,550 604,550 590,568" fill="#806222"/>
  <rect x="60" y="572" width="680" height="96" rx="10" fill="#191c19"/>
  <text x="400" y="612" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">計測が安定してから、もう一方を足す</text>
  <text x="400" y="648" font-size="22" fill="#ffffff" text-anchor="middle">成果の定義と数え方をそろえて比べる</text>
</svg>
