<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="820" fill="#f7f7f4"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#806222"/></marker>
  </defs>
  <text x="30" y="46" font-size="28" font-weight="bold" fill="#191c19">MEO業者の営業を受けたら確かめる順番</text>

  <rect x="30" y="76" width="510" height="112" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="50" y="116" font-size="26" font-weight="bold" fill="#191c19">1 だれからの営業か</text>
  <text x="50" y="150" font-size="24" fill="#41483c">Googleを名乗ったら、名前と</text>
  <text x="50" y="178" font-size="24" fill="#41483c">@google.comからのメールを求める</text>

  <rect x="30" y="206" width="510" height="112" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="50" y="246" font-size="26" font-weight="bold" fill="#191c19">2 何を約束するか</text>
  <text x="50" y="280" font-size="24" fill="#41483c">順位の保証、削除するという脅し、</text>
  <text x="50" y="308" font-size="24" fill="#41483c">無料の機能を有料と説明</text>

  <rect x="30" y="336" width="510" height="112" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="50" y="376" font-size="26" font-weight="bold" fill="#191c19">3 どんな手法か</text>
  <text x="50" y="410" font-size="24" fill="#41483c">店名に地域名やサービス名を足す、</text>
  <text x="50" y="438" font-size="24" fill="#41483c">口コミの代行や特典付きの依頼</text>

  <rect x="30" y="466" width="510" height="112" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="3"/>
  <text x="50" y="506" font-size="26" font-weight="bold" fill="#191c19">4 権限をどう持つか</text>
  <text x="50" y="540" font-size="24" fill="#41483c">自社がオーナーのまま、</text>
  <text x="50" y="568" font-size="24" fill="#41483c">業者は管理者として招待する</text>

  <rect x="30" y="596" width="510" height="112" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="3"/>
  <text x="50" y="636" font-size="26" font-weight="bold" fill="#191c19">5 書面に何があるか</text>
  <text x="50" y="670" font-size="24" fill="#41483c">有料であることの通知、費用、</text>
  <text x="50" y="698" font-size="24" fill="#41483c">解約の通知から7営業日以内の返還</text>

  <rect x="30" y="732" width="510" height="64" rx="10" fill="#191c19"/>
  <text x="285" y="773" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">すべて問題なければ契約を検討</text>

  <rect x="580" y="150" width="200" height="226" rx="10" fill="#ffffff" stroke="#806222" stroke-width="3"/>
  <text x="680" y="198" font-size="24" font-weight="bold" fill="#806222" text-anchor="middle">1〜3に</text>
  <text x="680" y="230" font-size="24" font-weight="bold" fill="#806222" text-anchor="middle">当てはまれば</text>
  <text x="680" y="270" font-size="24" fill="#191c19" text-anchor="middle">契約しない</text>
  <text x="680" y="310" font-size="24" fill="#191c19" text-anchor="middle">Googleに</text>
  <text x="680" y="340" font-size="24" fill="#191c19" text-anchor="middle">報告できる</text>

  <rect x="580" y="500" width="200" height="176" rx="10" fill="#ffffff" stroke="#806222" stroke-width="3"/>
  <text x="680" y="546" font-size="24" font-weight="bold" fill="#806222" text-anchor="middle">4・5が</text>
  <text x="680" y="578" font-size="24" font-weight="bold" fill="#806222" text-anchor="middle">満たせなければ</text>
  <text x="680" y="618" font-size="24" fill="#191c19" text-anchor="middle">条件を直すまで</text>
  <text x="680" y="650" font-size="24" fill="#191c19" text-anchor="middle">契約しない</text>

  <line x1="540" y1="132" x2="576" y2="200" stroke="#806222" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="540" y1="262" x2="576" y2="262" stroke="#806222" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="540" y1="392" x2="576" y2="330" stroke="#806222" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="540" y1="522" x2="576" y2="560" stroke="#806222" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="540" y1="652" x2="576" y2="620" stroke="#806222" stroke-width="3" marker-end="url(#ar)"/>
</svg>
