<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="800" height="680" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect x="0" y="0" width="800" height="680" fill="#f7f7f4"/>
  <text x="40" y="44" font-size="24" fill="#41483c" font-weight="bold">契約で決める項目</text>
  <text x="310" y="44" font-size="24" fill="#41483c" font-weight="bold">決め方</text>
  <g>
    <rect x="30" y="64" width="260" height="92" rx="8" fill="#806222"/>
    <text x="50" y="120" font-size="26" fill="#ffffff" font-weight="bold">著作権</text>
    <rect x="300" y="64" width="470" height="92" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
    <text x="320" y="102" font-size="24" fill="#191c19">譲渡か利用の許諾か。譲渡なら</text>
    <text x="320" y="136" font-size="24" fill="#191c19">第27条・第28条の権利も明記</text>
  </g>
  <g>
    <rect x="30" y="168" width="260" height="92" rx="8" fill="#806222"/>
    <text x="50" y="224" font-size="26" fill="#ffffff" font-weight="bold">著作者人格権</text>
    <rect x="300" y="168" width="470" height="92" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
    <text x="320" y="206" font-size="24" fill="#191c19">譲渡できない（第59条）。改変</text>
    <text x="320" y="240" font-size="24" fill="#191c19">するときの扱いを決めておく</text>
  </g>
  <g>
    <rect x="30" y="272" width="260" height="92" rx="8" fill="#806222"/>
    <text x="50" y="328" font-size="26" fill="#ffffff" font-weight="bold">ドメイン</text>
    <rect x="300" y="272" width="470" height="92" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
    <text x="320" y="310" font-size="24" fill="#191c19">登録者を自社にする。更新の</text>
    <text x="320" y="344" font-size="24" fill="#191c19">連絡を自社で受け取れるように</text>
  </g>
  <g>
    <rect x="30" y="376" width="260" height="92" rx="8" fill="#806222"/>
    <text x="50" y="432" font-size="26" fill="#ffffff" font-weight="bold">サーバー・CMS</text>
    <rect x="300" y="376" width="470" height="92" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
    <text x="320" y="414" font-size="24" fill="#191c19">契約者と管理者のIDを自社で</text>
    <text x="320" y="448" font-size="24" fill="#191c19">持ち、制作会社には作業用の権限</text>
  </g>
  <g>
    <rect x="30" y="480" width="260" height="92" rx="8" fill="#806222"/>
    <text x="50" y="524" font-size="26" fill="#ffffff" font-weight="bold">アクセス解析・</text>
    <text x="50" y="556" font-size="26" fill="#ffffff" font-weight="bold">Search Console</text>
    <rect x="300" y="480" width="470" height="92" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
    <text x="320" y="518" font-size="24" fill="#191c19">所有者は自社。制作会社には</text>
    <text x="320" y="552" font-size="24" fill="#191c19">必要な範囲の権限だけを渡す</text>
  </g>
  <g>
    <rect x="30" y="584" width="260" height="92" rx="8" fill="#806222"/>
    <text x="50" y="640" font-size="26" fill="#ffffff" font-weight="bold">写真・素材</text>
    <rect x="300" y="584" width="470" height="92" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
    <text x="320" y="622" font-size="24" fill="#191c19">使える範囲と期間、契約が</text>
    <text x="320" y="656" font-size="24" fill="#191c19">終わった後も使えるかを確認</text>
  </g>
</svg>
