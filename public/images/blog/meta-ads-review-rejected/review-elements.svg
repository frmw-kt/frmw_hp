<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="540" fill="#f7f7f4"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#806222"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="380" height="390" rx="16" fill="#ffffff" stroke="#191c19" stroke-width="2"/>
  <text x="210" y="56" font-size="24" fill="#41483c" text-anchor="middle">広告（フィードの表示）</text>
  <g stroke="#c9a84c" stroke-width="3" fill="#f7f7f4">
    <rect x="40" y="72" width="340" height="84" rx="10"/>
    <rect x="40" y="170" width="340" height="120" rx="10"/>
    <rect x="40" y="304" width="340" height="88" rx="10"/>
  </g>
  <rect x="440" y="20" width="340" height="390" rx="16" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <line x1="380" y1="348" x2="436" y2="348" stroke="#806222" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="20" y="430" width="760" height="94" rx="16" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <g font-size="28" font-weight="700" fill="#191c19" text-anchor="middle">
    <text x="210" y="108">テキスト</text>
    <text x="210" y="222">画像・動画</text>
    <text x="210" y="340">見出し・リンク</text>
    <text x="610" y="76">リンク先のページ</text>
    <text x="400" y="468">広告の設定</text>
  </g>
  <g font-size="24" fill="#41483c" text-anchor="middle">
    <text x="210" y="142">誇張・個人の特性</text>
    <text x="210" y="258">存在しない機能の表示</text>
    <text x="210" y="376">リンク先のURL</text>
    <text x="610" y="150">正しく機能するか</text>
    <text x="610" y="200">広告の内容と関連するか</text>
    <text x="610" y="250">誤解を招く内容がないか</text>
    <text x="610" y="300">ポップアップ広告など</text>
    <text x="610" y="336">邪魔な要素がないか</text>
    <text x="400" y="506">ターゲット設定・特別な広告カテゴリ・アクセス許可</text>
  </g>
</svg>
