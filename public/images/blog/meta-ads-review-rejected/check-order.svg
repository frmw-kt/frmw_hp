<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="560" fill="#f7f7f4"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#806222"/>
    </marker>
  </defs>
  <g fill="none" stroke="#806222" stroke-width="3" marker-end="url(#arrow)">
    <line x1="70" y1="128" x2="70" y2="150"/>
    <line x1="70" y1="268" x2="70" y2="290"/>
    <line x1="70" y1="408" x2="70" y2="430"/>
  </g>
  <g stroke="#e3e2dc" stroke-width="2" fill="#ffffff">
    <rect x="20" y="20" width="760" height="106" rx="12"/>
    <rect x="20" y="160" width="760" height="106" rx="12"/>
    <rect x="20" y="300" width="760" height="106" rx="12"/>
  </g>
  <rect x="20" y="440" width="760" height="106" rx="12" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <g fill="#806222">
    <circle cx="70" cy="73" r="28"/>
    <circle cx="70" cy="213" r="28"/>
    <circle cx="70" cy="353" r="28"/>
    <circle cx="70" cy="493" r="28"/>
  </g>
  <g font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="70" y="83">1</text>
    <text x="70" y="223">2</text>
    <text x="70" y="363">3</text>
    <text x="70" y="503">4</text>
  </g>
  <g font-size="28" font-weight="700" fill="#191c19">
    <text x="122" y="64">［配信］列で「却下済み」の広告を探す</text>
    <text x="122" y="204">お知らせメールから却下の理由を開く</text>
    <text x="122" y="344">理由に当たる構成要素を探す</text>
    <text x="122" y="484">対応を選ぶ</text>
  </g>
  <g font-size="24" fill="#41483c">
    <text x="122" y="104">キャンペーン・広告セット・広告の全レベル</text>
    <text x="122" y="244">Metaビジネスサポートホームで確認する</text>
    <text x="122" y="384">画像・動画／テキスト／ターゲット／リンク先</text>
    <text x="122" y="524">編集する／新しい広告を作る／再審査を頼む</text>
  </g>
</svg>
