<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="800" height="680" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="680" fill="#f7f7f4"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#806222"/>
    </marker>
  </defs>
  <g fill="none" stroke="#806222" stroke-width="3" marker-end="url(#arrow)">
    <line x1="400" y1="104" x2="400" y2="134"/>
    <path d="M300,226 L215,226 L215,280"/>
    <path d="M500,226 L590,226 L590,280"/>
    <line x1="215" y1="386" x2="215" y2="430"/>
    <path d="M40,336 L24,336 L24,600 L36,600"/>
    <line x1="590" y1="386" x2="590" y2="430"/>
    <path d="M770,336 L788,336 L788,600 L776,600"/>
  </g>
  <g stroke="#e3e2dc" stroke-width="2" fill="#ffffff">
    <rect x="220" y="20" width="360" height="82" rx="12"/>
    <rect x="40" y="284" width="350" height="100" rx="12"/>
    <rect x="410" y="284" width="360" height="100" rx="12"/>
  </g>
  <rect x="120" y="138" width="560" height="88" rx="12" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <g stroke="#806222" stroke-width="3" fill="#ffffff">
    <rect x="40" y="434" width="350" height="100" rx="12"/>
    <rect x="40" y="554" width="350" height="100" rx="12"/>
    <rect x="410" y="434" width="360" height="100" rx="12"/>
    <rect x="410" y="554" width="360" height="100" rx="12"/>
  </g>
  <g font-size="24" font-weight="700" fill="#806222" text-anchor="middle">
    <text x="250" y="216">いいえ</text>
    <text x="545" y="216">はい</text>
    <text x="227" y="418" text-anchor="start">はい</text>
    <text x="34" y="418" text-anchor="start">いいえ</text>
    <text x="580" y="418" text-anchor="end">取り消し</text>
    <text x="780" y="418" text-anchor="end">再び却下</text>
  </g>
  <g font-size="28" font-weight="700" fill="#191c19" text-anchor="middle">
    <text x="400" y="56">却下の理由を読む</text>
    <text x="400" y="192">規定に合っていると説明できるか</text>
    <text x="215" y="326">編集できる広告か</text>
    <text x="590" y="326">再審査をリクエスト</text>
    <text x="215" y="476">広告を編集して公開</text>
    <text x="215" y="626">新しい広告を作る</text>
    <text x="590" y="476">配信が再開される</text>
    <text x="590" y="626">同じ広告は再申請不可</text>
  </g>
  <g font-size="24" fill="#41483c" text-anchor="middle">
    <text x="400" y="88">ビジネスサポートホーム</text>
    <text x="215" y="366">広告の種類による</text>
    <text x="590" y="366">48時間以内の決定が目標</text>
    <text x="215" y="514">自動で再審査に入る</text>
    <text x="215" y="642">却下された広告は消さない</text>
    <text x="590" y="514">違反に数えられない</text>
    <text x="590" y="642">編集か新しい広告へ</text>
  </g>
</svg>
