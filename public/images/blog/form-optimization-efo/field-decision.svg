<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect x="0" y="0" width="800" height="470" fill="#f7f7f4"/>
  <text x="400" y="48" font-size="26" fill="#191c19" text-anchor="middle" font-weight="bold">項目ごとに、2つの問いで残すかを決める</text>
  <rect x="20" y="80" width="440" height="80" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="2"/>
  <text x="240" y="130" font-size="24" fill="#191c19" text-anchor="middle">① 最初の返信に必要か？</text>
  <line x1="460" y1="120" x2="508" y2="120" stroke="#806222" stroke-width="3"/>
  <polygon points="506,112 520,120 506,128" fill="#806222"/>
  <text x="488" y="106" font-size="22" fill="#806222" text-anchor="middle" font-weight="bold">はい</text>
  <rect x="520" y="80" width="260" height="80" rx="8" fill="#191c19"/>
  <text x="650" y="130" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">必須で残す</text>
  <line x1="240" y1="160" x2="240" y2="200" stroke="#806222" stroke-width="3"/>
  <polygon points="232,198 240,212 248,198" fill="#806222"/>
  <text x="290" y="192" font-size="22" fill="#806222" text-anchor="middle" font-weight="bold">いいえ</text>
  <rect x="20" y="212" width="440" height="100" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="2"/>
  <text x="240" y="253" font-size="24" fill="#191c19" text-anchor="middle">② 担当の振り分け・優先度の</text>
  <text x="240" y="288" font-size="24" fill="#191c19" text-anchor="middle">判断に使うか？</text>
  <line x1="460" y1="262" x2="508" y2="262" stroke="#806222" stroke-width="3"/>
  <polygon points="506,254 520,262 506,270" fill="#806222"/>
  <text x="488" y="248" font-size="22" fill="#806222" text-anchor="middle" font-weight="bold">はい</text>
  <rect x="520" y="212" width="260" height="100" rx="8" fill="#ffffff" stroke="#191c19" stroke-width="2"/>
  <text x="650" y="253" font-size="24" fill="#191c19" text-anchor="middle" font-weight="bold">選択式で残す</text>
  <text x="650" y="288" font-size="22" fill="#41483c" text-anchor="middle">必須か任意かを決める</text>
  <line x1="240" y1="312" x2="240" y2="352" stroke="#806222" stroke-width="3"/>
  <polygon points="232,350 240,364 248,350" fill="#806222"/>
  <text x="290" y="344" font-size="22" fill="#806222" text-anchor="middle" font-weight="bold">いいえ</text>
  <rect x="20" y="364" width="440" height="80" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="240" y="414" font-size="24" fill="#191c19" text-anchor="middle" font-weight="bold">外す（返信のやり取りで聞く）</text>
</svg>
