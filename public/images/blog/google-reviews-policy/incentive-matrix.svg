<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="720" fill="#f7f7f4"/>
  <!-- header -->
  <rect x="20" y="20" width="270" height="64" fill="#191c19"/>
  <rect x="294" y="20" width="236" height="64" fill="#191c19"/>
  <rect x="534" y="20" width="246" height="64" fill="#191c19"/>
  <text x="155" y="61" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">依頼のしかた</text>
  <text x="412" y="61" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Googleの規約</text>
  <text x="657" y="61" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">ステマ規制</text>

  <!-- row 1 -->
  <rect x="20" y="88" width="270" height="148" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <rect x="294" y="88" width="236" height="148" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <rect x="534" y="88" width="246" height="148" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="38" y="138" font-size="24" font-weight="bold" fill="#191c19">特典なしで</text>
  <text x="38" y="172" font-size="24" font-weight="bold" fill="#191c19">利用者に依頼</text>
  <text x="38" y="206" font-size="22" fill="#41483c">内容は指定しない</text>
  <text x="312" y="160" font-size="26" font-weight="bold" fill="#806222">○ 認められる</text>
  <text x="552" y="138" font-size="22" fill="#191c19">内容の決定に</text>
  <text x="552" y="170" font-size="22" fill="#191c19">関与しなければ</text>
  <text x="552" y="202" font-size="22" fill="#191c19">事業者の表示でない</text>

  <!-- row 2 -->
  <rect x="20" y="240" width="270" height="148" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <rect x="294" y="240" width="236" height="148" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <rect x="534" y="240" width="246" height="148" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="38" y="300" font-size="24" font-weight="bold" fill="#191c19">投稿を条件に</text>
  <text x="38" y="334" font-size="24" font-weight="bold" fill="#191c19">割引・クーポン</text>
  <text x="312" y="324" font-size="26" font-weight="bold" fill="#191c19">× 禁止</text>
  <text x="552" y="290" font-size="22" fill="#191c19">通常は</text>
  <text x="552" y="322" font-size="22" fill="#191c19">事業者の表示に</text>
  <text x="552" y="354" font-size="22" fill="#191c19">当たらない</text>

  <!-- row 3 -->
  <rect x="20" y="392" width="270" height="148" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <rect x="294" y="392" width="236" height="148" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <rect x="534" y="392" width="246" height="148" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="38" y="440" font-size="24" font-weight="bold" fill="#191c19">星5や推奨する</text>
  <text x="38" y="474" font-size="24" font-weight="bold" fill="#191c19">コメントを条件に</text>
  <text x="38" y="508" font-size="24" font-weight="bold" fill="#191c19">特典を付ける</text>
  <text x="312" y="476" font-size="26" font-weight="bold" fill="#191c19">× 禁止</text>
  <text x="552" y="442" font-size="22" fill="#191c19">事業者の表示。</text>
  <text x="552" y="474" font-size="22" fill="#191c19">そうと明示しないと</text>
  <text x="552" y="506" font-size="22" fill="#191c19">違反</text>

  <!-- row 4 -->
  <rect x="20" y="544" width="270" height="148" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <rect x="294" y="544" width="236" height="148" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <rect x="534" y="544" width="246" height="148" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="38" y="606" font-size="24" font-weight="bold" fill="#191c19">従業員・家族が</text>
  <text x="38" y="640" font-size="24" font-weight="bold" fill="#191c19">書く</text>
  <text x="312" y="610" font-size="26" font-weight="bold" fill="#191c19">× 禁止</text>
  <text x="312" y="646" font-size="22" fill="#41483c">（利益相反）</text>
  <text x="552" y="594" font-size="22" fill="#191c19">従業員は地位・</text>
  <text x="552" y="626" font-size="22" fill="#191c19">立場によって</text>
  <text x="552" y="658" font-size="22" fill="#191c19">事業者の表示</text>
</svg>
