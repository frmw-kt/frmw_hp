<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="600" fill="#f7f7f4"/>
  <rect x="40" y="20" width="720" height="92" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="3"/>
  <circle cx="86" cy="66" r="26" fill="#c9a84c"/>
  <text x="86" y="75" font-size="26" font-weight="bold" fill="#191c19" text-anchor="middle">1</text>
  <text x="128" y="58" font-size="24" font-weight="bold" fill="#191c19">投稿へのお礼と、必要に応じたお詫び</text>
  <text x="128" y="92" font-size="22" fill="#41483c">自社のミスなら、その点を認めて謝る</text>

  <rect x="40" y="128" width="720" height="92" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="3"/>
  <circle cx="86" cy="174" r="26" fill="#c9a84c"/>
  <text x="86" y="183" font-size="26" font-weight="bold" fill="#191c19" text-anchor="middle">2</text>
  <text x="128" y="166" font-size="24" font-weight="bold" fill="#191c19">記録で確かめた事実と、できること</text>
  <text x="128" y="200" font-size="22" fill="#41483c">非のないことまで責任を負わず、できないことも書く</text>

  <rect x="40" y="236" width="720" height="92" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="3"/>
  <circle cx="86" cy="282" r="26" fill="#c9a84c"/>
  <text x="86" y="291" font-size="26" font-weight="bold" fill="#191c19" text-anchor="middle">3</text>
  <text x="128" y="274" font-size="24" font-weight="bold" fill="#191c19">込み入った話は、電話やメールで</text>
  <text x="128" y="308" font-size="22" fill="#41483c">連絡を受ける窓口を短く示す</text>

  <rect x="40" y="344" width="720" height="92" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="3"/>
  <circle cx="86" cy="390" r="26" fill="#c9a84c"/>
  <text x="86" y="399" font-size="26" font-weight="bold" fill="#191c19" text-anchor="middle">4</text>
  <text x="128" y="382" font-size="24" font-weight="bold" fill="#191c19">返信した人の名前かイニシャル</text>
  <text x="128" y="416" font-size="22" fill="#41483c">誰が対応したかを示す</text>

  <rect x="40" y="460" width="720" height="120" rx="10" fill="#ffffff" stroke="#806222" stroke-width="3"/>
  <text x="64" y="500" font-size="24" font-weight="bold" fill="#806222">書かないこと</text>
  <text x="64" y="536" font-size="22" fill="#191c19">投稿者の個人情報（医療・財務の情報など）、個人攻撃、</text>
  <text x="64" y="566" font-size="22" fill="#191c19">割引や宣伝の持ちかけ</text>
</svg>
