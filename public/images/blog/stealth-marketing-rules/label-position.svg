<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="640" fill="#f7f7f4"/>
  <text x="24" y="44" font-size="24" font-weight="bold" fill="#191c19">SNSの投稿</text>

  <!-- post: body -->
  <rect x="24" y="64" width="366" height="236" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <rect x="44" y="84" width="326" height="108" rx="6" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="60" y="122" font-size="22" font-weight="bold" fill="#806222">【PR】A社から依頼</text>
  <text x="60" y="152" font-size="22" font-weight="bold" fill="#806222">を受けて投稿しています</text>
  <text x="60" y="180" font-size="22" fill="#41483c">商品の感想…</text>
  <text x="44" y="234" font-size="22" font-weight="bold" fill="#191c19">投稿の本文に書く</text>
  <text x="44" y="268" font-size="22" fill="#41483c">運用基準が例に挙げる方法</text>

  <!-- post: reply only -->
  <rect x="410" y="64" width="366" height="236" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="3"/>
  <rect x="430" y="84" width="326" height="64" rx="6" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="446" y="124" font-size="22" fill="#41483c">商品の感想…</text>
  <rect x="460" y="156" width="296" height="40" rx="6" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="474" y="184" font-size="22" fill="#41483c">↳ ツリーに「広告」</text>
  <text x="430" y="234" font-size="22" font-weight="bold" fill="#191c19">ツリー（リプライ）だけ</text>
  <text x="430" y="268" font-size="22" fill="#41483c">明瞭といえない場合が多い</text>

  <text x="24" y="352" font-size="24" font-weight="bold" fill="#191c19">動画</text>

  <!-- video: start only -->
  <rect x="24" y="372" width="366" height="244" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="3"/>
  <rect x="44" y="392" width="100" height="70" rx="6" fill="#41483c"/>
  <text x="94" y="436" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">広告</text>
  <rect x="152" y="392" width="100" height="70" rx="6" fill="#e3e2dc"/>
  <rect x="260" y="392" width="110" height="70" rx="6" fill="#e3e2dc"/>
  <text x="44" y="494" font-size="22" fill="#41483c">冒頭 → 途中 → 最後</text>
  <text x="44" y="540" font-size="22" font-weight="bold" fill="#191c19">冒頭にだけ表示</text>
  <text x="44" y="574" font-size="22" fill="#41483c">途中から見た人が</text>
  <text x="44" y="602" font-size="22" fill="#41483c">見逃すおそれ</text>

  <!-- video: always -->
  <rect x="410" y="372" width="366" height="244" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <rect x="430" y="392" width="100" height="70" rx="6" fill="#41483c"/>
  <rect x="538" y="392" width="100" height="70" rx="6" fill="#41483c"/>
  <rect x="646" y="392" width="110" height="70" rx="6" fill="#41483c"/>
  <text x="480" y="436" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">広告</text>
  <text x="588" y="436" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">広告</text>
  <text x="701" y="436" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">広告</text>
  <text x="430" y="494" font-size="22" fill="#41483c">冒頭 → 途中 → 最後</text>
  <text x="430" y="540" font-size="22" font-weight="bold" fill="#191c19">画面上に常に表示</text>
  <text x="430" y="574" font-size="22" fill="#41483c">動画全体を通して</text>
  <text x="430" y="602" font-size="22" fill="#41483c">分かるのが望ましい</text>
</svg>
