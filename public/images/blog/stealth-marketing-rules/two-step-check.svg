<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="600" fill="#f7f7f4"/>
  <!-- Q1 -->
  <rect x="24" y="24" width="440" height="160" rx="10" fill="#ffffff" stroke="#191c19" stroke-width="3"/>
  <text x="44" y="66" font-size="24" font-weight="bold" fill="#191c19">Q1 自社が投稿の内容の</text>
  <text x="44" y="102" font-size="24" font-weight="bold" fill="#191c19">決定に関与している？</text>
  <text x="44" y="140" font-size="22" fill="#41483c">内容の指示、個別の依頼と</text>
  <text x="44" y="168" font-size="22" fill="#41483c">報酬、好意的な声の選別など</text>
  <path d="M466 104 L506 104" stroke="#806222" stroke-width="3"/>
  <path d="M500 94 L514 104 L500 114 Z" fill="#806222"/>
  <text x="464" y="88" font-size="22" fill="#806222">いいえ</text>
  <rect x="516" y="24" width="260" height="160" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="3"/>
  <text x="532" y="66" font-size="22" font-weight="bold" fill="#191c19">事業者の表示</text>
  <text x="532" y="96" font-size="22" font-weight="bold" fill="#191c19">ではない</text>
  <text x="532" y="134" font-size="22" fill="#41483c">ステマ規制の</text>
  <text x="532" y="164" font-size="22" fill="#41483c">対象にならない</text>

  <path d="M244 186 L244 230" stroke="#806222" stroke-width="3"/>
  <path d="M234 224 L244 238 L254 224 Z" fill="#806222"/>
  <text x="258" y="218" font-size="22" fill="#806222">はい（事業者の表示）</text>

  <!-- Q2 -->
  <rect x="24" y="240" width="440" height="160" rx="10" fill="#ffffff" stroke="#191c19" stroke-width="3"/>
  <text x="44" y="282" font-size="24" font-weight="bold" fill="#191c19">Q2 事業者の表示だと</text>
  <text x="44" y="318" font-size="24" font-weight="bold" fill="#191c19">明瞭に示している？</text>
  <text x="44" y="356" font-size="22" fill="#41483c">「広告」「PR」などを</text>
  <text x="44" y="384" font-size="22" fill="#41483c">気付く位置に書いている</text>
  <path d="M466 320 L506 320" stroke="#806222" stroke-width="3"/>
  <path d="M500 310 L514 320 L500 330 Z" fill="#806222"/>
  <text x="474" y="304" font-size="22" fill="#806222">はい</text>
  <rect x="516" y="240" width="260" height="160" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="532" y="282" font-size="22" font-weight="bold" fill="#191c19">広告として</text>
  <text x="532" y="312" font-size="22" font-weight="bold" fill="#191c19">示している</text>
  <text x="532" y="350" font-size="22" fill="#41483c">ステマ告示には</text>
  <text x="532" y="380" font-size="22" fill="#41483c">違反しない</text>

  <path d="M244 402 L244 446" stroke="#806222" stroke-width="3"/>
  <path d="M234 440 L244 454 L254 440 Z" fill="#806222"/>
  <text x="258" y="434" font-size="22" fill="#806222">いいえ</text>

  <!-- result -->
  <rect x="24" y="456" width="752" height="120" rx="10" fill="#191c19"/>
  <text x="44" y="502" font-size="24" font-weight="bold" fill="#ffffff">ステマ告示に違反する</text>
  <text x="44" y="544" font-size="22" fill="#e3e2dc">消費者庁が広告主に措置命令（違反のおそれの段階では指導）</text>
</svg>
