<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="560" fill="#f7f7f4"/>
  <!-- advertiser -->
  <rect x="170" y="24" width="460" height="120" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="4"/>
  <text x="400" y="70" font-size="28" font-weight="bold" fill="#191c19" text-anchor="middle">広告主（規制の対象）</text>
  <text x="400" y="110" font-size="22" fill="#41483c" text-anchor="middle">商品・サービスを供給する事業者</text>

  <path d="M300 146 L210 214" stroke="#806222" stroke-width="3"/>
  <path d="M206 202 L202 220 L219 214 Z" fill="#806222"/>
  <text x="104" y="186" font-size="22" fill="#806222">依頼・提供</text>
  <path d="M500 146 L590 214" stroke="#806222" stroke-width="3"/>
  <path d="M581 214 L598 220 L594 202 Z" fill="#806222"/>
  <text x="560" y="186" font-size="22" fill="#806222">雇用</text>

  <!-- influencer -->
  <rect x="24" y="224" width="366" height="230" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="3"/>
  <text x="44" y="264" font-size="24" font-weight="bold" fill="#191c19">インフルエンサー・</text>
  <text x="44" y="296" font-size="24" font-weight="bold" fill="#191c19">アフィリエイター</text>
  <text x="44" y="338" font-size="22" fill="#41483c">依頼を受けて投稿する人は</text>
  <text x="44" y="368" font-size="22" font-weight="bold" fill="#806222">原則として対象外</text>
  <text x="44" y="408" font-size="22" fill="#41483c">例外：広告主と共同で</text>
  <text x="44" y="436" font-size="22" fill="#41483c">商品等を供給する場合</text>

  <!-- employee -->
  <rect x="410" y="224" width="366" height="230" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="3"/>
  <text x="430" y="264" font-size="24" font-weight="bold" fill="#191c19">従業員の投稿</text>
  <text x="430" y="306" font-size="22" fill="#41483c">感想を投稿しただけでは</text>
  <text x="430" y="336" font-size="22" fill="#41483c">直ちに違反とはされない</text>
  <text x="430" y="378" font-size="22" fill="#41483c">販売を促進する立場の</text>
  <text x="430" y="408" font-size="22" fill="#41483c">人の販促の投稿は</text>
  <text x="430" y="438" font-size="22" font-weight="bold" fill="#806222">事業者の表示</text>

  <!-- bottom -->
  <rect x="24" y="476" width="752" height="64" rx="10" fill="#191c19"/>
  <text x="400" y="517" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">違反したとき措置命令を受けるのは広告主</text>
</svg>
