<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect x="0" y="0" width="800" height="580" fill="#f7f7f4"/>
  <rect x="30" y="20" width="370" height="540" rx="12" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="56" y="64" font-size="24" fill="#191c19" font-weight="bold">お問い合わせ</text>
