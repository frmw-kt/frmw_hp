  <rect x="56" y="222" width="290" height="42" rx="6" fill="#ffffff" stroke="#806222" stroke-width="3"/>
  <text x="68" y="251" font-size="22" fill="#41483c">name@example</text>
  <text x="56" y="294" font-size="22" fill="#806222">形式を確認してください</text>
  <text x="56" y="342" font-size="22" fill="#191c19">ご相談内容</text>
  <rect x="56" y="356" width="290" height="96" rx="6" fill="#ffffff" stroke="#41483c" stroke-width="1.5"/>
  <rect x="56" y="476" width="290" height="60" rx="8" fill="#191c19"/>
  <text x="201" y="514" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">無料で相談する</text>
  <g font-size="22" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <circle cx="372" cy="56" r="16" fill="#c9a84c"/><text x="372" y="64">1</text>
    <circle cx="372" cy="106" r="16" fill="#c9a84c"/><text x="372" y="114">2</text>
    <circle cx="300" cy="203" r="16" fill="#c9a84c"/><text x="300" y="211">3</text>
    <circle cx="372" cy="243" r="16" fill="#c9a84c"/><text x="372" y="251">4</text>
    <circle cx="372" cy="287" r="16" fill="#c9a84c"/><text x="372" y="295">5</text>
    <circle cx="372" cy="506" r="16" fill="#c9a84c"/><text x="372" y="514">6</text>
  </g>
  <g font-size="22" fill="#191c19">
    <circle cx="448" cy="72" r="16" fill="#c9a84c"/><text x="448" y="80" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
    <text x="476" y="80">項目はできるだけ少なく</text>
    <circle cx="448" cy="152" r="16" fill="#c9a84c"/><text x="448" y="160" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
    <text x="476" y="160">ラベルは入力欄の上・1列</text>
    <circle cx="448" cy="232" r="16" fill="#c9a84c"/><text x="448" y="240" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
