<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="580" fill="#f7f7f4"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#41483c"/>
    </marker>
  </defs>
  <!-- Q1 -->
  <rect x="20" y="30" width="420" height="130" rx="10" fill="#ffffff" stroke="#191c19" stroke-width="2"/>
  <text x="230" y="80" font-size="24" fill="#191c19" text-anchor="middle">サイト構築サービスが</text>
  <text x="230" y="114" font-size="24" fill="#191c19" text-anchor="middle">パートナー連携に対応？</text>
  <!-- R1 -->
  <rect x="500" y="30" width="280" height="130" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="640" y="80" font-size="24" fill="#191c19" text-anchor="middle" font-weight="bold">パートナー連携</text>
  <text x="640" y="114" font-size="24" fill="#41483c" text-anchor="middle">（コード不要）</text>
  <line x1="442" y1="95" x2="496" y2="95" stroke="#41483c" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="470" y="80" font-size="22" fill="#806222" text-anchor="middle">はい</text>
  <!-- Q1 -> Q2 -->
  <line x1="230" y1="162" x2="230" y2="216" stroke="#41483c" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="270" y="198" font-size="22" fill="#806222" text-anchor="middle">いいえ</text>
  <!-- Q2 -->
  <rect x="20" y="220" width="420" height="130" rx="10" fill="#ffffff" stroke="#191c19" stroke-width="2"/>
  <text x="230" y="270" font-size="24" fill="#191c19" text-anchor="middle">Googleタグマネージャー</text>
  <text x="230" y="304" font-size="24" fill="#191c19" text-anchor="middle">（GTM）を使っている？</text>
  <!-- R2 -->
  <rect x="500" y="220" width="280" height="130" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="640" y="270" font-size="24" fill="#191c19" text-anchor="middle" font-weight="bold">GTMのタグで</text>
  <text x="640" y="304" font-size="24" fill="#41483c" text-anchor="middle">全ページに置く</text>
  <line x1="442" y1="285" x2="496" y2="285" stroke="#41483c" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="470" y="270" font-size="22" fill="#806222" text-anchor="middle">はい</text>
  <!-- Q2 -> R3 -->
  <line x1="230" y1="352" x2="230" y2="406" stroke="#41483c" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="270" y="388" font-size="22" fill="#806222" text-anchor="middle">いいえ</text>
  <!-- R3 -->
  <rect x="20" y="410" width="760" height="140" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="400" y="462" font-size="24" fill="#191c19" text-anchor="middle" font-weight="bold">全ページの&lt;head&gt;にベースコードを貼る</text>
  <text x="400" y="500" font-size="24" fill="#41483c" text-anchor="middle">（サイトのコードを編集できる人が必要）</text>
</svg>
