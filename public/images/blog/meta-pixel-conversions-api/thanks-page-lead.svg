<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="560" fill="#f7f7f4"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#41483c"/>
    </marker>
  </defs>
  <!-- step 1 -->
  <rect x="20" y="20" width="340" height="96" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="190" y="76" font-size="24" fill="#191c19" text-anchor="middle">LP・サービスページ</text>
  <text x="390" y="60" font-size="24" fill="#41483c">ベースコードは全ページで</text>
  <text x="390" y="92" font-size="24" fill="#41483c">ページビューを記録</text>
  <line x1="190" y1="118" x2="190" y2="148" stroke="#41483c" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- step 2 -->
  <rect x="20" y="152" width="340" height="96" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="190" y="208" font-size="24" fill="#191c19" text-anchor="middle">フォームに入力</text>
  <line x1="190" y1="250" x2="190" y2="280" stroke="#41483c" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- step 3 -->
  <rect x="20" y="284" width="340" height="96" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="190" y="340" font-size="24" fill="#191c19" text-anchor="middle">送信ボタンを押す</text>
  <text x="390" y="324" font-size="24" fill="#41483c">ボタンに付けると、送信が</text>
  <text x="390" y="356" font-size="24" fill="#41483c">完了しなくても数える</text>
  <line x1="190" y1="382" x2="190" y2="412" stroke="#41483c" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- step 4 -->
  <rect x="20" y="416" width="340" height="120" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="190" y="466" font-size="24" fill="#191c19" text-anchor="middle" font-weight="bold">完了ページ</text>
  <text x="190" y="500" font-size="24" fill="#41483c" text-anchor="middle">（サンクスページ）</text>
  <rect x="380" y="436" width="400" height="80" rx="10" fill="#ffffff" stroke="#806222" stroke-width="2"/>
  <text x="580" y="486" font-size="24" fill="#806222" text-anchor="middle" font-weight="bold">ここで「リード」を記録</text>
</svg>
