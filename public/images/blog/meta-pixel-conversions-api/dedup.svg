<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="520" fill="#f7f7f4"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#41483c"/>
    </marker>
  </defs>
  <!-- browser -->
  <rect x="20" y="20" width="360" height="160" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="200" y="64" font-size="24" fill="#191c19" text-anchor="middle" font-weight="bold">ピクセル（ブラウザ）</text>
  <text x="200" y="110" font-size="24" fill="#41483c" text-anchor="middle">イベント名：Lead</text>
  <text x="200" y="148" font-size="24" fill="#41483c" text-anchor="middle">eventID：A123</text>
  <!-- server -->
  <rect x="420" y="20" width="360" height="160" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="600" y="64" font-size="24" fill="#191c19" text-anchor="middle" font-weight="bold">API（サーバー）</text>
  <text x="600" y="110" font-size="24" fill="#41483c" text-anchor="middle">event_name：Lead</text>
  <text x="600" y="148" font-size="24" fill="#41483c" text-anchor="middle">event_id：A123</text>
  <!-- arrows -->
  <line x1="200" y1="182" x2="340" y2="246" stroke="#41483c" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="182" x2="460" y2="246" stroke="#41483c" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- merged -->
  <rect x="140" y="250" width="520" height="120" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="400" y="300" font-size="26" fill="#806222" text-anchor="middle" font-weight="bold">1件として数える</text>
  <text x="400" y="340" font-size="24" fill="#41483c" text-anchor="middle">（通常は先に受け取った方）</text>
  <!-- condition -->
  <text x="400" y="420" font-size="24" fill="#191c19" text-anchor="middle">条件：イベント名とIDが一致し、</text>
  <text x="400" y="456" font-size="24" fill="#191c19" text-anchor="middle">最初の受信から48時間以内に届く</text>
</svg>
