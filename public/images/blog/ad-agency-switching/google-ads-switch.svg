<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#806222"/>
    </marker>
  </defs>
  <rect x="30" y="20" width="740" height="90" rx="8" fill="#f7f7f4" stroke="#c9a84c" stroke-width="2"/>
  <text x="400" y="58" font-size="24" font-weight="bold" text-anchor="middle" fill="#191c19">Q 自社のユーザーに、広告アカウントの</text>
  <text x="400" y="92" font-size="24" font-weight="bold" text-anchor="middle" fill="#191c19">管理者権限があるか</text>

  <line x1="210" y1="110" x2="210" y2="164" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>
  <text x="228" y="146" font-size="22" fill="#806222" font-weight="bold">ある</text>
  <line x1="590" y1="110" x2="590" y2="164" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>
  <text x="608" y="146" font-size="22" fill="#806222" font-weight="bold">ない</text>

  <rect x="430" y="170" width="340" height="150" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="600" y="210" font-size="24" text-anchor="middle" fill="#191c19">旧代理店に、自社の</text>
  <text x="600" y="244" font-size="24" text-anchor="middle" fill="#191c19">ユーザーを管理者として</text>
  <text x="600" y="278" font-size="24" text-anchor="middle" fill="#191c19">招待してもらう</text>
  <path d="M430,245 L396,245" stroke="#806222" stroke-width="3" fill="none" marker-end="url(#arw)"/>

  <rect x="30" y="170" width="360" height="150" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="210" y="210" font-size="24" text-anchor="middle" fill="#191c19">新しい代理店のMCCから</text>
  <text x="210" y="244" font-size="24" text-anchor="middle" fill="#191c19">届くリンク リクエストを</text>
  <text x="210" y="278" font-size="24" text-anchor="middle" fill="#191c19">自社の管理者が承認</text>

  <line x1="210" y1="320" x2="210" y2="364" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>
  <rect x="30" y="370" width="740" height="90" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="400" y="408" font-size="24" text-anchor="middle" fill="#191c19">共有リスト・クロスアカウントの計測・請求を</text>
  <text x="400" y="442" font-size="24" text-anchor="middle" fill="#191c19">広告アカウント側に移してから</text>

  <line x1="400" y1="460" x2="400" y2="494" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>
  <rect x="30" y="500" width="740" height="80" rx="8" fill="#f7f7f4" stroke="#c9a84c" stroke-width="2"/>
  <text x="400" y="534" font-size="24" font-weight="bold" text-anchor="middle" fill="#806222">旧代理店のMCCとのリンクを解除</text>
  <text x="400" y="566" font-size="22" text-anchor="middle" fill="#41483c">（オーナーのMCCでも解除でき、アカウントの履歴は残る）</text>
</svg>
