<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#806222"/>
    </marker>
  </defs>
  <rect x="30" y="20" width="740" height="90" rx="8" fill="#f7f7f4" stroke="#c9a84c" stroke-width="2"/>
  <text x="400" y="58" font-size="24" font-weight="bold" text-anchor="middle" fill="#191c19">Q 広告アカウントを所有している</text>
  <text x="400" y="92" font-size="24" font-weight="bold" text-anchor="middle" fill="#191c19">ビジネスポートフォリオはどこか</text>

  <line x1="200" y1="110" x2="200" y2="164" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>
  <text x="218" y="146" font-size="22" fill="#806222" font-weight="bold">自社</text>
  <line x1="590" y1="110" x2="590" y2="164" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>
  <text x="608" y="146" font-size="22" fill="#806222" font-weight="bold">旧代理店</text>

  <rect x="30" y="170" width="340" height="250" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="200" y="214" font-size="24" text-anchor="middle" fill="#191c19">新しい代理店を</text>
  <text x="200" y="248" font-size="24" text-anchor="middle" fill="#191c19">パートナーに追加し、</text>
  <text x="200" y="282" font-size="24" text-anchor="middle" fill="#191c19">引き継ぎ後に</text>
  <text x="200" y="316" font-size="24" text-anchor="middle" fill="#191c19">旧代理店を</text>
  <text x="200" y="350" font-size="24" text-anchor="middle" fill="#191c19">パートナーから削除</text>
  <text x="200" y="396" font-size="22" text-anchor="middle" fill="#806222" font-weight="bold">アカウントはそのまま</text>

  <rect x="400" y="170" width="370" height="76" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="2"/>
  <text x="585" y="203" font-size="24" text-anchor="middle" fill="#806222" font-weight="bold">自社のポートフォリオへ</text>
  <text x="585" y="234" font-size="24" text-anchor="middle" fill="#806222" font-weight="bold">移すことはできない</text>
  <line x1="490" y1="246" x2="490" y2="280" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>
  <line x1="680" y1="246" x2="680" y2="280" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>
  <rect x="400" y="286" width="180" height="134" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="490" y="320" font-size="22" text-anchor="middle" fill="#191c19" font-weight="bold">A 共有を</text>
  <text x="490" y="350" font-size="22" text-anchor="middle" fill="#191c19" font-weight="bold">続けてもらう</text>
  <text x="490" y="384" font-size="22" text-anchor="middle" fill="#41483c">所有者の承認</text>
  <text x="490" y="410" font-size="22" text-anchor="middle" fill="#41483c">が必要</text>
  <rect x="590" y="286" width="180" height="134" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="680" y="320" font-size="22" text-anchor="middle" fill="#191c19" font-weight="bold">B 自社で新しい</text>
  <text x="680" y="350" font-size="22" text-anchor="middle" fill="#191c19" font-weight="bold">アカウントを作る</text>
  <text x="680" y="384" font-size="22" text-anchor="middle" fill="#41483c">履歴は</text>
  <text x="680" y="410" font-size="22" text-anchor="middle" fill="#41483c">引き継がれない</text>

  <rect x="30" y="450" width="740" height="120" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="400" y="494" font-size="24" font-weight="bold" text-anchor="middle" fill="#191c19">Facebookページ・Instagramアカウント・</text>
  <text x="400" y="530" font-size="24" font-weight="bold" text-anchor="middle" fill="#191c19">データセットも、同じ順で所有者を確かめる</text>
</svg>
