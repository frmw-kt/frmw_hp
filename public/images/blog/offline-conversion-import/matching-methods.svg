<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="520" fill="#f7f7f4"/>
  <!-- 上段：GCLIDのみ -->
  <rect x="20" y="20" width="760" height="220" rx="12" fill="#ffffff" stroke="#e3e2dc" stroke-width="3"/>
  <text x="40" y="62" font-size="24" font-weight="bold" fill="#191c19">オフライン コンバージョンのインポート</text>
  <text x="40" y="96" font-size="22" fill="#41483c">（GCLIDだけで照合）</text>
  <rect x="40" y="120" width="300" height="70" rx="10" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="190" y="164" font-size="24" fill="#41483c" text-anchor="middle">GCLID</text>
  <polygon points="350,143 380,155 350,167" fill="#806222"/>
  <rect x="390" y="120" width="370" height="70" rx="10" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="575" y="164" font-size="24" fill="#41483c" text-anchor="middle">広告のクリックと照合</text>
  <text x="40" y="224" font-size="22" fill="#806222">IDを保存していない問い合わせは結びつかない</text>
  <!-- 下段：リードの拡張 -->
  <rect x="20" y="260" width="760" height="240" rx="12" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="40" y="302" font-size="24" font-weight="bold" fill="#191c19">リードの拡張コンバージョン</text>
  <text x="40" y="336" font-size="22" fill="#806222">（Googleが新しく始める場合に推奨）</text>
  <rect x="40" y="356" width="300" height="100" rx="10" fill="#f7f7f4" stroke="#c9a84c" stroke-width="2"/>
  <text x="190" y="396" font-size="24" fill="#41483c" text-anchor="middle">GCLID＋</text>
  <text x="190" y="432" font-size="22" fill="#41483c" text-anchor="middle">ハッシュ化したメール等</text>
  <polygon points="350,394 380,406 350,418" fill="#806222"/>
  <rect x="390" y="356" width="370" height="100" rx="10" fill="#f7f7f4" stroke="#c9a84c" stroke-width="2"/>
  <text x="575" y="396" font-size="24" fill="#41483c" text-anchor="middle">クリックと、ログイン中の</text>
  <text x="575" y="432" font-size="24" fill="#41483c" text-anchor="middle">Googleアカウントで照合</text>
  <text x="40" y="486" font-size="22" fill="#41483c">GCLIDがない成約もメール等で照合できる</text>
</svg>
