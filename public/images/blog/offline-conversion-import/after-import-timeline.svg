<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="600" fill="#f7f7f4"/>
  <!-- 見出し -->
  <rect x="20" y="20" width="370" height="60" rx="10" fill="#c9a84c"/>
  <text x="205" y="60" font-size="24" font-weight="bold" fill="#191c19" text-anchor="middle">Google広告</text>
  <rect x="410" y="20" width="370" height="60" rx="10" fill="#191c19"/>
  <text x="595" y="60" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Meta広告（CRM連携）</text>
  <!-- Google列 -->
  <rect x="20" y="100" width="370" height="84" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="205" y="136" font-size="24" fill="#191c19" text-anchor="middle">アクションを作成</text>
  <text x="205" y="168" font-size="22" fill="#41483c" text-anchor="middle">4〜6時間たってから取り込む</text>
  <polygon points="193,190 217,190 205,204" fill="#806222"/>
  <rect x="20" y="210" width="370" height="84" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="205" y="246" font-size="24" fill="#191c19" text-anchor="middle">毎日アップロード</text>
  <text x="205" y="278" font-size="22" fill="#41483c" text-anchor="middle">すべての成約を送る</text>
  <polygon points="193,300 217,300 205,314" fill="#806222"/>
  <rect x="20" y="320" width="370" height="84" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="205" y="356" font-size="24" font-weight="bold" fill="#191c19" text-anchor="middle">2〜3週間は「サブ」</text>
  <text x="205" y="388" font-size="22" fill="#41483c" text-anchor="middle">記録と［診断］タブを確認</text>
  <polygon points="193,410 217,410 205,424" fill="#806222"/>
  <rect x="20" y="430" width="370" height="84" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="205" y="466" font-size="24" fill="#191c19" text-anchor="middle">入札に使う目標へ</text>
  <text x="205" y="498" font-size="22" fill="#41483c" text-anchor="middle">想定どおり記録されたら</text>
  <!-- Meta列 -->
  <rect x="410" y="100" width="370" height="84" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="595" y="136" font-size="24" fill="#191c19" text-anchor="middle">CRMを連携</text>
  <text x="595" y="168" font-size="22" fill="#41483c" text-anchor="middle">パートナーなら1日未満</text>
  <polygon points="583,190 607,190 595,204" fill="#806222"/>
  <rect x="410" y="210" width="370" height="84" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="595" y="246" font-size="24" fill="#191c19" text-anchor="middle">データの確認</text>
  <text x="595" y="278" font-size="22" fill="#41483c" text-anchor="middle">約1〜2日（Meta側）</text>
  <polygon points="583,300 607,300 595,314" fill="#806222"/>
  <rect x="410" y="320" width="370" height="84" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="595" y="356" font-size="24" fill="#191c19" text-anchor="middle">ファネルの段階を設定</text>
  <text x="595" y="388" font-size="22" fill="#41483c" text-anchor="middle">1日未満</text>
  <polygon points="583,410 607,410 595,424" fill="#806222"/>
  <rect x="410" y="430" width="370" height="84" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="595" y="466" font-size="24" font-weight="bold" fill="#191c19" text-anchor="middle">分析と学習 2〜4週間</text>
  <text x="595" y="498" font-size="22" fill="#41483c" text-anchor="middle">状況が変わるたびに送る</text>
  <!-- 下注 -->
  <text x="400" y="566" font-size="22" fill="#41483c" text-anchor="middle">自社で開発する場合、Metaの連携は3〜4週間が目安</text>
</svg>
