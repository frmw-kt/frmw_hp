<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="640" fill="#f7f7f4"/>
  <!-- 問い1 -->
  <rect x="120" y="20" width="560" height="96" rx="12" fill="#ffffff" stroke="#191c19" stroke-width="3"/>
  <text x="400" y="60" font-size="24" font-weight="bold" fill="#191c19" text-anchor="middle">成約はクリックから</text>
  <text x="400" y="96" font-size="24" font-weight="bold" fill="#191c19" text-anchor="middle">取り込める期間内に起きるか</text>
  <!-- 分岐線 -->
  <line x1="260" y1="116" x2="200" y2="176" stroke="#806222" stroke-width="3"/>
  <line x1="540" y1="116" x2="600" y2="176" stroke="#806222" stroke-width="3"/>
  <text x="196" y="156" font-size="24" fill="#806222" text-anchor="middle">はい</text>
  <text x="608" y="156" font-size="24" fill="#806222" text-anchor="middle">いいえ</text>
  <!-- はい -->
  <rect x="20" y="180" width="370" height="150" rx="12" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="205" y="224" font-size="24" font-weight="bold" fill="#191c19" text-anchor="middle">商談と成約を別々に返す</text>
  <text x="205" y="266" font-size="24" fill="#41483c" text-anchor="middle">「有望な見込み顧客」</text>
  <text x="205" y="304" font-size="22" fill="#41483c" text-anchor="middle">「コンバージョンに至った…」</text>
  <!-- いいえ -->
  <rect x="410" y="180" width="370" height="150" rx="12" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="595" y="224" font-size="24" font-weight="bold" fill="#191c19" text-anchor="middle">期間内に起きる商談を返す</text>
  <text x="595" y="266" font-size="24" fill="#41483c" text-anchor="middle">見積もり提出・面談など</text>
  <text x="595" y="304" font-size="24" fill="#41483c" text-anchor="middle">「有望な見込み顧客」</text>
  <!-- 期間の注記 -->
  <rect x="20" y="356" width="760" height="120" rx="12" fill="#ffffff" stroke="#e3e2dc" stroke-width="3"/>
  <text x="40" y="398" font-size="24" font-weight="bold" fill="#191c19">取り込める期間</text>
  <text x="40" y="440" font-size="24" fill="#41483c">Google：GCLIDは90日以内（接続先により14日）</text>
  <text x="40" y="468" font-size="22" fill="#41483c">Meta（CRM連携の目安）：リード獲得から28日以内</text>
  <!-- Metaの件数 -->
  <rect x="20" y="496" width="760" height="124" rx="12" fill="#191c19"/>
  <text x="40" y="540" font-size="24" font-weight="bold" fill="#ffffff">Metaで質に合わせて配信するなら件数も確認</text>
  <text x="40" y="586" font-size="24" fill="#ffffff">月200リード以上・段階の割合1〜40%・毎日送る</text>
</svg>
