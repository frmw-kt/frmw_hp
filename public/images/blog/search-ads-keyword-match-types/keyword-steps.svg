<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <title>リスティング広告のキーワードを選ぶ4段階</title>
  <desc>①商品・サービス名と地域と目的の語を掛け合わせて候補を洗い出す。②キーワードプランナーで検索ボリュームと入札単価の範囲を確かめる。③マッチタイプ（インテント マッチ、フレーズ一致、完全一致）で表示範囲を決める。④配信後に検索語句レポートを見て、関係のない語句を除外キーワードに入れる。成果につながった語句は①の候補に戻す。</desc>
  <rect width="800" height="600" fill="#f7f7f4"/>
  <text x="32" y="48" font-size="28" font-weight="700" fill="#191c19">キーワードを選ぶ4段階</text>

  <rect x="32" y="72" width="660" height="96" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="56" y="112" font-size="26" font-weight="700" fill="#191c19">① 洗い出す</text>
  <text x="56" y="148" font-size="22" fill="#41483c">商品・サービス名 × 地域 × 目的の語</text>

  <path d="M362 172 L362 192" stroke="#806222" stroke-width="4"/>
  <path d="M350 188 L362 204 L374 188 Z" fill="#806222"/>

  <rect x="32" y="208" width="660" height="96" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="56" y="248" font-size="26" font-weight="700" fill="#191c19">② 確かめる</text>
  <text x="56" y="284" font-size="22" fill="#41483c">キーワードプランナーで検索ボリュームと単価</text>

  <path d="M362 308 L362 328" stroke="#806222" stroke-width="4"/>
  <path d="M350 324 L362 340 L374 324 Z" fill="#806222"/>

  <rect x="32" y="344" width="660" height="96" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="56" y="384" font-size="26" font-weight="700" fill="#191c19">③ 範囲を決める</text>
  <text x="56" y="420" font-size="22" fill="#41483c">マッチタイプ（インテント マッチ／フレーズ／完全）</text>

  <path d="M362 444 L362 464" stroke="#806222" stroke-width="4"/>
  <path d="M350 460 L362 476 L374 460 Z" fill="#806222"/>

  <rect x="32" y="480" width="660" height="96" rx="10" fill="#ffffff" stroke="#806222" stroke-width="3"/>
  <text x="56" y="520" font-size="26" font-weight="700" fill="#806222">④ 除く（配信後）</text>
  <text x="56" y="556" font-size="22" fill="#41483c">検索語句レポート → 除外キーワード</text>

  <path d="M696 528 L774 528 L774 120 L710 120" stroke="#806222" stroke-width="4" fill="none"/>
  <path d="M714 108 L698 120 L714 132 Z" fill="#806222"/>
  <text x="736" y="270" font-size="22" fill="#806222" writing-mode="tb">候補に戻す</text>
</svg>
