<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect x="0" y="0" width="800" height="700" fill="#f7f7f4"/>

  <!-- column headers -->
  <rect x="120" y="20" width="330" height="70" rx="8" fill="#e3e2dc"/>
  <text x="285" y="64" text-anchor="middle" font-size="26" font-weight="bold" fill="#191c19">誤りの影響：小</text>
  <rect x="460" y="20" width="330" height="70" rx="8" fill="#191c19"/>
  <text x="625" y="64" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">誤りの影響：大</text>

  <!-- row headers -->
  <rect x="10" y="100" width="100" height="285" rx="8" fill="#191c19"/>
  <text x="60" y="230" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">社外に</text>
  <text x="60" y="264" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">出る</text>
  <rect x="10" y="395" width="100" height="285" rx="8" fill="#e3e2dc"/>
  <text x="60" y="525" text-anchor="middle" font-size="26" font-weight="bold" fill="#191c19">社内</text>
  <text x="60" y="559" text-anchor="middle" font-size="26" font-weight="bold" fill="#191c19">だけ</text>

  <!-- top-left -->
  <rect x="120" y="100" width="330" height="285" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="140" y="150" font-size="26" font-weight="bold" fill="#806222">担当者が確認して</text>
  <text x="140" y="186" font-size="26" font-weight="bold" fill="#806222">から公開</text>
  <text x="140" y="250" font-size="24" fill="#41483c">例：SNS投稿の文案、</text>
  <text x="140" y="286" font-size="24" fill="#41483c">記事の構成案</text>

  <!-- top-right -->
  <rect x="460" y="100" width="330" height="285" rx="8" fill="#ffffff" stroke="#806222" stroke-width="5"/>
  <text x="480" y="150" font-size="26" font-weight="bold" fill="#806222">AIは下書きまで。</text>
  <text x="480" y="186" font-size="26" font-weight="bold" fill="#806222">根拠と照合し、</text>
  <text x="480" y="222" font-size="26" font-weight="bold" fill="#806222">確認者が承認</text>
  <text x="480" y="286" font-size="24" fill="#41483c">例：広告文・LPの</text>
  <text x="480" y="322" font-size="24" fill="#41483c">価格・効果の表記</text>

  <!-- bottom-left -->
  <rect x="120" y="395" width="330" height="285" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="3"/>
  <text x="140" y="445" font-size="26" font-weight="bold" fill="#191c19">任せてよい。</text>
  <text x="140" y="481" font-size="26" font-weight="bold" fill="#191c19">使う人が目を通す</text>
  <text x="140" y="545" font-size="24" fill="#41483c">例：会議メモの要約、</text>
  <text x="140" y="581" font-size="24" fill="#41483c">企画の案出し</text>

  <!-- bottom-right -->
  <rect x="460" y="395" width="330" height="285" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="480" y="445" font-size="26" font-weight="bold" fill="#191c19">数値を元データと</text>
  <text x="480" y="481" font-size="26" font-weight="bold" fill="#191c19">照合してから使う</text>
  <text x="480" y="545" font-size="24" fill="#41483c">例：広告レポートの</text>
  <text x="480" y="581" font-size="24" fill="#41483c">集計・変化の説明</text>
</svg>
