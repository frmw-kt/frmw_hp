<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" width="800" height="760" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#806222"/></marker>
  </defs>
  <rect width="800" height="760" fill="#f7f7f4"/>
  <rect x="20" y="20" width="760" height="330" rx="12" fill="#ffffff" stroke="#191c19" stroke-width="3"/>
  <text x="44" y="64" font-size="26" font-weight="bold" fill="#191c19">自社のビジネスポートフォリオ</text>
  <text x="44" y="102" font-size="24" fill="#41483c">自社の担当者がフルアクセス許可を持つ</text>
  <rect x="44" y="126" width="350" height="200" rx="10" fill="#f7f7f4" stroke="#c9a84c" stroke-width="3"/>
  <text x="64" y="170" font-size="24" font-weight="bold" fill="#191c19">Instagram</text>
  <text x="64" y="204" font-size="24" font-weight="bold" fill="#191c19">プロアカウント</text>
  <text x="64" y="248" font-size="22" fill="#41483c">追加できるポートフォ</text>
  <text x="64" y="280" font-size="22" fill="#41483c">リオは1つだけ</text>
  <rect x="414" y="126" width="342" height="200" rx="10" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="3"/>
  <text x="434" y="170" font-size="24" font-weight="bold" fill="#191c19">広告アカウント</text>
  <text x="434" y="214" font-size="22" fill="#41483c">広告も任せる場合に</text>
  <text x="434" y="246" font-size="22" fill="#41483c">共有する</text>
  <line x1="400" y1="350" x2="400" y2="404" stroke="#806222" stroke-width="3" marker-end="url(#a)"/>
  <text x="414" y="388" font-size="22" fill="#806222" font-weight="bold">パートナーとして共有</text>
  <rect x="20" y="410" width="760" height="200" rx="12" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="44" y="454" font-size="26" font-weight="bold" fill="#191c19">代行会社のビジネスポートフォリオ</text>
  <text x="44" y="492" font-size="24" fill="#41483c">部分的なアクセス許可（任せるタスクだけ）</text>
  <g font-size="22" fill="#191c19">
    <rect x="44" y="516" width="135" height="70" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
    <text x="111" y="559" text-anchor="middle">コンテンツ</text>
    <rect x="191" y="516" width="135" height="70" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
    <text x="258" y="559" text-anchor="middle">メッセージ</text>
    <rect x="338" y="516" width="165" height="70" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
    <text x="420" y="546" text-anchor="middle">コミュニティ</text>
    <text x="420" y="574" text-anchor="middle">アクティビティ</text>
    <rect x="515" y="516" width="95" height="70" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
    <text x="562" y="559" text-anchor="middle">広告</text>
    <rect x="622" y="516" width="135" height="70" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
    <text x="689" y="559" text-anchor="middle">インサイト</text>
  </g>
  <rect x="20" y="636" width="760" height="104" rx="12" fill="#191c19"/>
  <text x="44" y="678" font-size="24" fill="#ffffff">他の人へのアクセス許可の付与・削除と、</text>
  <text x="44" y="714" font-size="24" fill="#ffffff">支払い方法を含むすべての管理はフルアクセスだけ</text>
</svg>
