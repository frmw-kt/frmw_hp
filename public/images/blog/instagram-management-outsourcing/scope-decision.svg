<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 880" width="800" height="880" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#806222"/></marker>
  </defs>
  <rect width="800" height="880" fill="#f7f7f4"/>
  <g font-size="24" fill="#191c19">
    <rect x="20" y="20" width="380" height="120" rx="10" fill="#ffffff" stroke="#191c19" stroke-width="2"/>
    <text x="38" y="66">Q1 撮影・制作の素材を</text>
    <text x="38" y="104">社内で用意できる？</text>
    <rect x="500" y="20" width="280" height="120" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
    <text x="514" y="58">企画・制作を任せる</text>
    <text x="514" y="92" font-size="22">投稿も任せるなら</text>
    <text x="514" y="124" font-size="22">「コンテンツ」を渡す</text>

    <rect x="20" y="210" width="380" height="120" rx="10" fill="#ffffff" stroke="#191c19" stroke-width="2"/>
    <text x="38" y="256">Q2 コメント・DMに</text>
    <text x="38" y="294">社内で答えられる？</text>
    <rect x="500" y="210" width="280" height="120" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
    <text x="514" y="248">回答の範囲を決めて</text>
    <text x="514" y="282" font-size="22">「コミュニティアク</text>
    <text x="514" y="314" font-size="22">ティビティ」などを渡す</text>

    <rect x="20" y="400" width="380" height="120" rx="10" fill="#ffffff" stroke="#191c19" stroke-width="2"/>
    <text x="38" y="446">Q3 数字を見て次の企画</text>
    <text x="38" y="484">を社内で決められる？</text>
    <rect x="500" y="400" width="280" height="120" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
    <text x="514" y="440">分析とレポートを</text>
    <text x="514" y="474">任せる</text>
    <text x="514" y="506" font-size="22">「インサイト」を渡す</text>

    <rect x="20" y="590" width="380" height="120" rx="10" fill="#ffffff" stroke="#191c19" stroke-width="2"/>
    <text x="38" y="636">Q4 Instagramに</text>
    <text x="38" y="674">広告を出す？</text>
    <rect x="500" y="590" width="280" height="120" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
    <text x="514" y="636">「広告」と</text>
    <text x="514" y="674">広告アカウントを渡す</text>

    <rect x="20" y="760" width="760" height="100" rx="10" fill="#191c19"/>
    <text x="400" y="802" fill="#ffffff" text-anchor="middle">渡すのは選んだタスクだけ。</text>
    <text x="400" y="840" fill="#ffffff" text-anchor="middle">権限の管理と投稿の承認は自社に残す</text>
  </g>
  <g stroke="#806222" stroke-width="3" fill="none" marker-end="url(#a)">
    <line x1="400" y1="88" x2="494" y2="88"/>
    <line x1="400" y1="278" x2="494" y2="278"/>
    <line x1="400" y1="468" x2="494" y2="468"/>
    <line x1="400" y1="658" x2="494" y2="658"/>
    <line x1="210" y1="140" x2="210" y2="204"/>
    <line x1="210" y1="330" x2="210" y2="394"/>
    <line x1="210" y1="520" x2="210" y2="584"/>
    <line x1="210" y1="710" x2="210" y2="754"/>
  </g>
  <g font-size="22" fill="#806222" font-weight="bold">
    <text x="414" y="76">いいえ</text>
    <text x="414" y="266">いいえ</text>
    <text x="414" y="456">いいえ</text>
    <text x="424" y="646">はい</text>
    <text x="222" y="180">はい</text>
    <text x="222" y="370">はい</text>
    <text x="222" y="560">はい</text>
    <text x="222" y="742">いいえ</text>
  </g>
</svg>
