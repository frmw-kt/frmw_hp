    <text x="110" y="188" font-size="26" fill="#191c19" font-weight="bold">すべての広告にかかる禁止</text>
    <text x="110" y="226" font-size="22" fill="#41483c">虚偽・比較優良・誇大・体験談・前後写真</text>
