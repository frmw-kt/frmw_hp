    <text x="110" y="316" font-size="26" fill="#191c19" font-weight="bold">載せる事項</text>
    <text x="110" y="354" font-size="22" fill="#41483c">広告できる事項か、限定解除の要件を満たすか</text>
  </g>
  <path d="M400 376 L400 394" stroke="#806222" stroke-width="3"/><path d="M391 388 L400 400 L409 388 Z" fill="#806222"/>
  <g>
