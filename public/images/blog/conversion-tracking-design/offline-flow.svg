<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect x="0" y="0" width="800" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#806222"/>
    </marker>
  </defs>
  <g>
    <rect x="20" y="20" width="760" height="92" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
    <circle cx="62" cy="66" r="24" fill="#c9a84c"/>
    <text x="62" y="75" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
    <text x="104" y="56" font-size="24" fill="#191c19" font-weight="bold">広告のクリック</text>
    <text x="104" y="92" font-size="22" fill="#41483c">クリックごとにGCLID（固有のID）が付く</text>
  </g>
  <line x1="400" y1="114" x2="400" y2="142" stroke="#806222" stroke-width="3" marker-end="url(#arrow)"/>
  <g>
    <rect x="20" y="146" width="760" height="92" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="4"/>
    <circle cx="62" cy="192" r="24" fill="#c9a84c"/>
    <text x="62" y="201" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
    <text x="104" y="182" font-size="24" fill="#191c19" font-weight="bold">問い合わせの受け付け</text>
    <text x="104" y="218" font-size="22" fill="#41483c">GCLIDを見込み顧客の情報と一緒に保存する</text>
  </g>
  <line x1="400" y1="240" x2="400" y2="268" stroke="#806222" stroke-width="3" marker-end="url(#arrow)"/>
  <g>
    <rect x="20" y="272" width="760" height="92" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
    <circle cx="62" cy="318" r="24" fill="#c9a84c"/>
    <text x="62" y="327" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
    <text x="104" y="308" font-size="24" fill="#191c19" font-weight="bold">商談・成約</text>
    <text x="104" y="344" font-size="22" fill="#41483c">サイトの外で起きる。自社の顧客管理に記録する</text>
  </g>
  <line x1="400" y1="366" x2="400" y2="394" stroke="#806222" stroke-width="3" marker-end="url(#arrow)"/>
  <g>
    <rect x="20" y="398" width="760" height="92" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
    <circle cx="62" cy="444" r="24" fill="#c9a84c"/>
    <text x="62" y="453" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
    <text x="104" y="434" font-size="24" fill="#191c19" font-weight="bold">Google広告に返す</text>
    <text x="104" y="470" font-size="22" fill="#41483c">GCLID・コンバージョンの種類・時期（GCLIDは90日以内）</text>
  </g>
  <rect x="20" y="514" width="760" height="66" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="400" y="555" font-size="22" fill="#41483c" text-anchor="middle">Meta広告：サーバーやCRMから、コンバージョンAPIで送る</text>
</svg>
