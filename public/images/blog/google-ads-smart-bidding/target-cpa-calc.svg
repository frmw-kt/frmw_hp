<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="500" fill="#ffffff"/>
  <rect x="20" y="20" width="760" height="110" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="400" y="60" font-size="24" fill="#191c19" text-anchor="middle">いま：月10万円・20件・実績CPA 5,000円</text>
  <text x="400" y="100" font-size="22" fill="#41483c" text-anchor="middle">目標値は8,000円・「予算による制限」（すべて仮定）</text>

  <path d="M220 130 L220 168" stroke="#806222" stroke-width="3"/>
  <path d="M212 168 L220 180 L228 168 Z" fill="#806222"/>
  <path d="M580 130 L580 168" stroke="#806222" stroke-width="3"/>
  <path d="M572 168 L580 180 L588 168 Z" fill="#806222"/>

  <rect x="20" y="184" width="370" height="290" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="205" y="226" font-size="24" fill="#191c19" text-anchor="middle" font-weight="bold">目標値8,000円のまま</text>
  <text x="205" y="276" font-size="22" fill="#41483c" text-anchor="middle">CPAが8,000円に近づく</text>
  <text x="205" y="326" font-size="24" fill="#191c19" text-anchor="middle">10万円 ÷ 8,000円</text>
  <text x="205" y="380" font-size="30" fill="#806222" text-anchor="middle" font-weight="bold">＝ 12.5件</text>
  <text x="205" y="440" font-size="22" fill="#41483c" text-anchor="middle">予算を増やせば件数は増える</text>

  <rect x="410" y="184" width="370" height="290" rx="8" fill="#f8f1dc" stroke="#c9a84c" stroke-width="3"/>
  <text x="595" y="226" font-size="24" fill="#191c19" text-anchor="middle" font-weight="bold">目標値を5,000円に</text>
  <text x="595" y="276" font-size="22" fill="#41483c" text-anchor="middle">実績に近い水準を目指す</text>
  <text x="595" y="326" font-size="24" fill="#191c19" text-anchor="middle">10万円 ÷ 5,000円</text>
  <text x="595" y="380" font-size="30" fill="#806222" text-anchor="middle" font-weight="bold">＝ 約20件</text>
  <text x="595" y="440" font-size="22" fill="#41483c" text-anchor="middle">同じ予算で件数を保つ</text>
</svg>
