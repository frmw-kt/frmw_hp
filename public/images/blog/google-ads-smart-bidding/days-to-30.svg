<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="470" fill="#ffffff"/>
  <rect x="20" y="20" width="760" height="120" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="400" y="66" font-size="24" fill="#191c19" text-anchor="middle">① 月の予算 ÷ CPA ＝ 月の件数の目安</text>
  <text x="400" y="112" font-size="24" fill="#191c19" text-anchor="middle">② 30 ÷ 月の件数 × 30.4 ＝ 30件に届く日数</text>

  <rect x="20" y="164" width="370" height="280" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="205" y="206" font-size="24" fill="#191c19" text-anchor="middle" font-weight="bold">月10万円・CPA 5,000円</text>
  <text x="205" y="258" font-size="24" fill="#41483c" text-anchor="middle">① 10万 ÷ 5,000 ＝ 20件</text>
  <text x="205" y="306" font-size="24" fill="#41483c" text-anchor="middle">② 30 ÷ 20 × 30.4</text>
  <text x="205" y="364" font-size="30" fill="#806222" text-anchor="middle" font-weight="bold">≒ 46日</text>
  <text x="205" y="418" font-size="22" fill="#41483c" text-anchor="middle">30日では30件に届かない</text>

  <rect x="410" y="164" width="370" height="280" rx="8" fill="#f8f1dc" stroke="#c9a84c" stroke-width="3"/>
  <text x="595" y="206" font-size="24" fill="#191c19" text-anchor="middle" font-weight="bold">月30万円・CPA 5,000円</text>
  <text x="595" y="258" font-size="24" fill="#41483c" text-anchor="middle">① 30万 ÷ 5,000 ＝ 60件</text>
  <text x="595" y="306" font-size="24" fill="#41483c" text-anchor="middle">② 30 ÷ 60 × 30.4</text>
  <text x="595" y="364" font-size="30" fill="#806222" text-anchor="middle" font-weight="bold">≒ 16日</text>
  <text x="595" y="418" font-size="22" fill="#41483c" text-anchor="middle">予算・CPAはどちらも仮定</text>
</svg>
