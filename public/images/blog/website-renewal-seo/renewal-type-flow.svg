<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect x="0" y="0" width="800" height="520" fill="#f7f7f4"/>
  <rect x="170" y="20" width="460" height="64" rx="8" fill="#191c19"/>
  <text x="400" y="62" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">ページのURLは変わるか</text>
  <line x1="400" y1="84" x2="400" y2="108" stroke="#806222" stroke-width="3"/>
  <line x1="205" y1="108" x2="595" y2="108" stroke="#806222" stroke-width="3"/>
  <line x1="205" y1="108" x2="205" y2="126" stroke="#806222" stroke-width="3"/>
  <line x1="595" y1="108" x2="595" y2="126" stroke="#806222" stroke-width="3"/>
  <polygon points="197,124 213,124 205,136" fill="#806222"/>
  <polygon points="587,124 603,124 595,136" fill="#806222"/>
  <rect x="30" y="138" width="350" height="362" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="205" y="178" font-size="26" fill="#806222" text-anchor="middle" font-weight="bold">変わらない</text>
  <text x="205" y="226" font-size="24" fill="#191c19" text-anchor="middle">デザイン・文章だけ</text>
  <text x="205" y="260" font-size="22" fill="#41483c" text-anchor="middle">→ 移転の手順は不要</text>
  <line x1="60" y1="290" x2="350" y2="290" stroke="#e3e2dc" stroke-width="2"/>
  <text x="205" y="334" font-size="24" fill="#191c19" text-anchor="middle">サーバー・CDNの変更</text>
  <text x="205" y="368" font-size="22" fill="#41483c" text-anchor="middle">→ ホスティング変更の</text>
  <text x="205" y="400" font-size="22" fill="#41483c" text-anchor="middle">手順（DNS・テスト）</text>
  <rect x="420" y="138" width="350" height="362" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="595" y="178" font-size="26" fill="#806222" text-anchor="middle" font-weight="bold">変わる</text>
  <text x="595" y="226" font-size="24" fill="#191c19" text-anchor="middle">同じドメインで</text>
  <text x="595" y="258" font-size="24" fill="#191c19" text-anchor="middle">パスが変わる</text>
  <text x="595" y="292" font-size="22" fill="#41483c" text-anchor="middle">→ URL対応表＋301</text>
  <text x="595" y="322" font-size="22" fill="#41483c" text-anchor="middle">＋新しいサイトマップ</text>
  <line x1="450" y1="346" x2="740" y2="346" stroke="#e3e2dc" stroke-width="2"/>
  <text x="595" y="388" font-size="24" fill="#191c19" text-anchor="middle">ドメインが変わる</text>
  <text x="595" y="422" font-size="22" fill="#41483c" text-anchor="middle">→ 上の作業に加えて</text>
  <text x="595" y="454" font-size="22" fill="#41483c" text-anchor="middle">アドレス変更ツール</text>
</svg>
