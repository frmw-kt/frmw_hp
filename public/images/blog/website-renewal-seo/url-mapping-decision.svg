  <line x1="660" y1="104" x2="660" y2="122" stroke="#806222" stroke-width="3"/>
  <polygon points="132,120 148,120 140,132" fill="#806222"/>
  <polygon points="392,120 408,120 400,132" fill="#806222"/>
  <polygon points="652,120 668,120 660,132" fill="#806222"/>
  <rect x="20" y="134" width="240" height="326" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="140" y="176" font-size="24" fill="#806222" text-anchor="middle" font-weight="bold">同じ内容の</text>
