  <text x="660" y="206" font-size="24" fill="#806222" text-anchor="middle" font-weight="bold">（削除する）</text>
  <line x1="564" y1="232" x2="756" y2="232" stroke="#e3e2dc" stroke-width="2"/>
  <text x="660" y="280" font-size="24" fill="#191c19" text-anchor="middle">404か410を</text>
