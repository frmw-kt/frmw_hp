  <text x="140" y="314" font-size="24" fill="#191c19" text-anchor="middle">301で1対1</text>
  <rect x="280" y="134" width="240" height="326" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="400" y="176" font-size="24" fill="#806222" text-anchor="middle" font-weight="bold">複数ページを</text>
  <text x="400" y="206" font-size="24" fill="#806222" text-anchor="middle" font-weight="bold">1ページに統合</text>
  <line x1="304" y1="232" x2="496" y2="232" stroke="#e3e2dc" stroke-width="2"/>
