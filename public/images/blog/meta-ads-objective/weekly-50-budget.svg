<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="560" fill="#f7f7f4"/>
  <rect x="20" y="20" width="760" height="120" rx="12" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <g font-size="26" font-weight="700" fill="#191c19" text-anchor="middle">
    <text x="400" y="66">週50件に必要な月の予算</text>
    <text x="400" y="110">＝ 50件 × 4.3週 × 1件の単価</text>
  </g>
  <g font-size="22" font-weight="700" fill="#806222">
    <text x="40" y="186">1件の単価（仮定）</text>
    <text x="440" y="186">必要な月の予算</text>
  </g>
  <g stroke="#e3e2dc" stroke-width="2">
    <line x1="20" y1="204" x2="780" y2="204"/>
    <line x1="20" y1="274" x2="780" y2="274"/>
    <line x1="20" y1="344" x2="780" y2="344"/>
    <line x1="20" y1="414" x2="780" y2="414"/>
  </g>
  <g font-size="26" fill="#191c19">
    <text x="40" y="250">約465円</text>
    <text x="40" y="320">2,000円</text>
    <text x="40" y="390">5,000円</text>
    <text x="40" y="460">10,000円</text>
  </g>
  <g font-size="26" font-weight="700" fill="#191c19">
    <text x="440" y="250">約10万円</text>
    <text x="440" y="320">43万円</text>
    <text x="440" y="390">107.5万円</text>
    <text x="440" y="460">215万円</text>
  </g>
  <g font-size="22" fill="#41483c">
    <text x="40" y="510">月＝約4.3週で計算。単価はすべて仮定で、実際の単価は配信してから</text>
    <text x="40" y="540">広告マネージャの［結果］列と結果の単価で確かめる</text>
  </g>
</svg>
