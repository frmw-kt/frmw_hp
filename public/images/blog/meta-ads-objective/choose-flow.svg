<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" width="800" height="760" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="760" fill="#f7f7f4"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#806222"/>
    </marker>
  </defs>
  <g fill="none" stroke="#806222" stroke-width="3" marker-end="url(#arrow)">
    <line x1="400" y1="112" x2="400" y2="150"/>
    <line x1="400" y1="292" x2="400" y2="330"/>
    <line x1="400" y1="452" x2="400" y2="490"/>
    <path d="M300,590 L170,590 L170,636"/>
    <path d="M500,590 L630,590 L630,636"/>
  </g>
  <g stroke="#c9a84c" stroke-width="3" fill="#ffffff">
    <rect x="100" y="20" width="600" height="92" rx="12"/>
    <rect x="100" y="334" width="600" height="118" rx="12"/>
    <rect x="200" y="494" width="400" height="96" rx="12"/>
  </g>
  <g stroke="#806222" stroke-width="3" fill="#ffffff">
    <rect x="20" y="154" width="760" height="138" rx="12"/>
    <rect x="20" y="640" width="300" height="104" rx="12"/>
    <rect x="360" y="640" width="420" height="104" rx="12"/>
  </g>
  <g font-size="26" font-weight="700" fill="#191c19" text-anchor="middle">
    <text x="400" y="58">1. 増やしたい成果は何か</text>
    <text x="400" y="372">2. 成果が起きる場所を選ぶ</text>
    <text x="400" y="534">3. 1週間で約50件に</text>
    <text x="400" y="570">届く見込みがあるか</text>
    <text x="170" y="682">最終の成果を</text>
    <text x="170" y="718">目標にする</text>
    <text x="570" y="682">件数が取れる手前の</text>
    <text x="570" y="718">段階を目標にする</text>
  </g>
  <g font-size="22" fill="#41483c" text-anchor="middle">
    <text x="400" y="94">問い合わせ・予約・購入・閲覧・認知</text>
    <text x="400" y="196">問い合わせ・予約 → リード</text>
    <text x="400" y="230">購入 → 売上　ページの閲覧 → トラフィック</text>
    <text x="400" y="264">メッセージでの相談 → エンゲージメントなど</text>
    <text x="400" y="408">ウェブサイト／インスタントフォーム／</text>
    <text x="400" y="438">Messenger／通話 など</text>
  </g>
  <g font-size="22" font-weight="700" fill="#806222">
    <text x="182" y="628">ある</text>
    <text x="642" y="628">ない</text>
  </g>
</svg>
