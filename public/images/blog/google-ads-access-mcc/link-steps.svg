<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#806222"/>
    </marker>
  </defs>
  <rect x="30" y="20" width="740" height="88" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="50" y="56" font-size="22" font-weight="bold" fill="#806222">1 自社</text>
  <text x="170" y="56" font-size="24" fill="#191c19">管理者権限を持つ人を2人以上にし、</text>
  <text x="170" y="90" font-size="24" fill="#191c19">お客様ID番号を代理店に伝える</text>
  <line x1="400" y1="108" x2="400" y2="132" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>

  <rect x="30" y="136" width="740" height="88" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="50" y="172" font-size="22" font-weight="bold" fill="#806222">2 代理店</text>
  <text x="170" y="172" font-size="24" fill="#191c19">MCCの［サブアカウントの設定］で</text>
  <text x="170" y="206" font-size="24" fill="#191c19">［既存のアカウントをリンク］を送る</text>
  <line x1="400" y1="224" x2="400" y2="248" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>

  <rect x="30" y="252" width="740" height="88" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="50" y="288" font-size="22" font-weight="bold" fill="#806222">3 自社</text>
  <text x="170" y="288" font-size="24" fill="#191c19">管理者が［アクセスとセキュリティ］の</text>
  <text x="170" y="322" font-size="24" fill="#191c19">［管理者］タブでリクエストを承認</text>
  <line x1="400" y1="340" x2="400" y2="364" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>

  <rect x="30" y="368" width="740" height="88" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="50" y="404" font-size="22" font-weight="bold" fill="#806222">4 自社</text>
  <text x="170" y="404" font-size="24" fill="#191c19">求められたら、別の管理者の承認や</text>
  <text x="170" y="438" font-size="24" fill="#191c19">パスキーでの本人確認を済ませる</text>
  <line x1="400" y1="456" x2="400" y2="480" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>

  <rect x="30" y="484" width="740" height="96" rx="8" fill="#f7f7f4" stroke="#c9a84c" stroke-width="2"/>
  <text x="400" y="522" font-size="24" font-weight="bold" text-anchor="middle" fill="#806222">リンク完了（既定ではオーナー権限は付かない）</text>
  <text x="400" y="560" font-size="22" text-anchor="middle" fill="#41483c">［MCC］タブで代理店のMCCとオーナー列を確かめる</text>
</svg>
