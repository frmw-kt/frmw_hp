<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#806222"/>
    </marker>
  </defs>
  <text x="210" y="44" font-size="26" font-weight="bold" text-anchor="middle" fill="#806222">A ユーザーとして招待</text>
  <text x="590" y="44" font-size="26" font-weight="bold" text-anchor="middle" fill="#806222">B 代理店のMCCとリンク</text>

  <rect x="30" y="66" width="360" height="110" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="210" y="112" font-size="24" text-anchor="middle" fill="#191c19">代理店の担当者</text>
  <text x="210" y="146" font-size="24" text-anchor="middle" fill="#191c19">（1人ずつ）</text>
  <rect x="410" y="66" width="360" height="110" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="590" y="112" font-size="24" text-anchor="middle" fill="#191c19">代理店のMCC</text>
  <text x="590" y="146" font-size="24" text-anchor="middle" fill="#191c19">（担当者をまとめて管理）</text>

  <line x1="210" y1="176" x2="210" y2="262" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>
  <text x="226" y="212" font-size="22" fill="#41483c">自社の管理者が</text>
  <text x="226" y="242" font-size="22" fill="#41483c">権限を選んで招待</text>
  <line x1="590" y1="176" x2="590" y2="262" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>
  <text x="606" y="212" font-size="22" fill="#41483c">代理店が申請し</text>
  <text x="606" y="242" font-size="22" fill="#41483c">自社が承認</text>

  <rect x="30" y="268" width="740" height="100" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="2"/>
  <text x="400" y="310" font-size="24" font-weight="bold" text-anchor="middle" fill="#191c19">自社の広告アカウント</text>
  <text x="400" y="346" font-size="24" text-anchor="middle" fill="#806222">自社のユーザーが管理者権限を持ち続ける</text>

  <rect x="30" y="392" width="360" height="148" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="210" y="434" font-size="22" text-anchor="middle" fill="#41483c">代理店側にMCCがなくても</text>
  <text x="210" y="466" font-size="22" text-anchor="middle" fill="#41483c">使える。担当者ごとに</text>
  <text x="210" y="498" font-size="22" text-anchor="middle" fill="#41483c">権限を変更・削除する</text>
  <rect x="410" y="392" width="360" height="148" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="590" y="434" font-size="22" text-anchor="middle" fill="#41483c">MCCの管理者権限を持つ</text>
  <text x="590" y="466" font-size="22" text-anchor="middle" fill="#41483c">人がキャンペーンを管理。</text>
  <text x="590" y="498" font-size="22" text-anchor="middle" fill="#41483c">外すときはリンクを解除</text>
</svg>
