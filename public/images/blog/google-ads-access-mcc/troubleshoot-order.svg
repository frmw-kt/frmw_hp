<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#806222"/>
    </marker>
  </defs>
  <rect x="30" y="20" width="740" height="88" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="50" y="58" font-size="24" font-weight="bold" fill="#806222">1 権限</text>
  <text x="170" y="58" font-size="24" fill="#191c19">承認する人が広告アカウントの</text>
  <text x="170" y="92" font-size="24" fill="#191c19">「管理者」か（標準では承認できない）</text>
  <line x1="400" y1="108" x2="400" y2="132" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>

  <rect x="30" y="136" width="740" height="88" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="50" y="174" font-size="24" font-weight="bold" fill="#806222">2 ID</text>
  <text x="170" y="174" font-size="24" fill="#191c19">代理店に伝えたお客様ID番号が</text>
  <text x="170" y="208" font-size="24" fill="#191c19">その広告アカウントのものか</text>
  <line x1="400" y1="224" x2="400" y2="248" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>

  <rect x="30" y="252" width="740" height="88" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="50" y="290" font-size="24" font-weight="bold" fill="#806222">3 上限</text>
  <text x="170" y="290" font-size="24" fill="#191c19">リンク済みのMCCが5つ、代理店の</text>
  <text x="170" y="324" font-size="24" fill="#191c19">保留中の招待が20件に達していないか</text>
  <line x1="400" y1="340" x2="400" y2="364" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>

  <rect x="30" y="368" width="740" height="88" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="50" y="406" font-size="24" font-weight="bold" fill="#806222">4 階層</text>
  <text x="170" y="406" font-size="24" fill="#191c19">同じ階層のMCCにすでに</text>
  <text x="170" y="440" font-size="24" fill="#191c19">リンクされていないか</text>
  <line x1="400" y1="456" x2="400" y2="480" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>

  <rect x="30" y="484" width="740" height="96" rx="8" fill="#f7f7f4" stroke="#c9a84c" stroke-width="2"/>
  <text x="50" y="524" font-size="24" font-weight="bold" fill="#806222">5 承認</text>
  <text x="170" y="524" font-size="24" fill="#191c19">［セキュリティ リクエスト］タブで</text>
  <text x="170" y="558" font-size="24" fill="#191c19">別の管理者の承認待ちになっていないか</text>
</svg>
