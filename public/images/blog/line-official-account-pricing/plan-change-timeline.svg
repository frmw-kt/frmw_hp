<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="プラン変更と支払いの時期。月額固定費は月初に前払い。アップグレードは差額を払えば今月から適用。ダウングレードは今月中に申し込むと翌月から適用。追加メッセージ料金は月末で締めて翌月10日頃に後払い">
  <rect width="800" height="600" fill="#f7f7f4"/>
  <g font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
    <text x="24" y="46" font-size="28" font-weight="700" fill="#191c19">プラン変更と支払いの時期</text>

    <rect x="24" y="66" width="356" height="48" rx="8" fill="#191c19"/>
    <text x="44" y="99" font-size="24" font-weight="700" fill="#ffffff">今月</text>
    <rect x="420" y="66" width="356" height="48" rx="8" fill="#191c19"/>
    <text x="440" y="99" font-size="24" font-weight="700" fill="#ffffff">翌月</text>

    <rect x="24" y="130" width="356" height="92" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
    <text x="42" y="168" font-size="24" font-weight="700" fill="#191c19">月額固定費</text>
    <text x="42" y="202" font-size="22" fill="#41483c">月初に前払い</text>
    <rect x="420" y="130" width="356" height="92" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
    <text x="438" y="168" font-size="24" font-weight="700" fill="#191c19">月額固定費</text>
    <text x="438" y="202" font-size="22" fill="#41483c">翌月分も月初に前払い</text>

    <rect x="24" y="238" width="356" height="92" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
    <text x="42" y="276" font-size="24" font-weight="700" fill="#191c19">アップグレード</text>
    <text x="42" y="310" font-size="22" fill="#41483c">差額を払えば今月から適用</text>
    <rect x="420" y="238" width="356" height="92" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
    <text x="438" y="292" font-size="22" fill="#41483c">（変えなければ同じプラン）</text>

    <rect x="24" y="346" width="356" height="92" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
    <text x="42" y="384" font-size="24" font-weight="700" fill="#191c19">ダウングレード</text>
    <text x="42" y="418" font-size="22" fill="#41483c">今月中に申し込む</text>
    <path d="M384 392 L404 392" stroke="#806222" stroke-width="4"/>
    <path d="M400 382 L414 392 L400 402 Z" fill="#806222"/>
    <rect x="420" y="346" width="356" height="92" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
    <text x="438" y="384" font-size="24" font-weight="700" fill="#191c19">翌月から適用</text>
    <text x="438" y="418" font-size="22" fill="#41483c">下のプランの通数になる</text>

    <rect x="24" y="454" width="356" height="92" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
    <text x="42" y="492" font-size="24" font-weight="700" fill="#191c19">追加メッセージ</text>
    <text x="42" y="526" font-size="22" fill="#41483c">月末で締める</text>
    <path d="M384 500 L404 500" stroke="#806222" stroke-width="4"/>
    <path d="M400 490 L414 500 L400 510 Z" fill="#806222"/>
    <rect x="420" y="454" width="356" height="92" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
    <text x="438" y="492" font-size="24" font-weight="700" fill="#191c19">翌月10日頃に</text>
    <text x="438" y="526" font-size="22" fill="#41483c">追加料金を後払い</text>

    <text x="24" y="584" font-size="22" fill="#41483c">追加メッセージを送れるのはスタンダードプランだけ</text>
  </g>
</svg>
