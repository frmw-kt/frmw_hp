<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="LINE公式アカウントの通数は、送った回数と送った友だちの数を掛けて数える。1回の配信は最大3吹き出しまで。ブロック中の人には届かない。例として300人に月4回送ると1,200通">
  <rect width="800" height="420" fill="#f7f7f4"/>
  <g font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
    <text x="24" y="46" font-size="28" font-weight="700" fill="#191c19">通数＝送った回数×送った友だちの数</text>

    <rect x="24" y="78" width="230" height="150" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
    <text x="42" y="128" font-size="26" font-weight="700" fill="#191c19">送った回数</text>
    <text x="42" y="168" font-size="22" fill="#41483c">1回＝最大3</text>
    <text x="42" y="200" font-size="22" fill="#41483c">吹き出しまで</text>

    <text x="260" y="166" font-size="32" font-weight="700" fill="#806222">×</text>

    <rect x="294" y="78" width="262" height="150" rx="10" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
    <text x="312" y="128" font-size="26" font-weight="700" fill="#191c19">送った友だちの数</text>
    <text x="312" y="168" font-size="22" fill="#41483c">ブロック中の人には</text>
    <text x="312" y="200" font-size="22" fill="#41483c">届かない</text>

    <text x="562" y="166" font-size="32" font-weight="700" fill="#806222">＝</text>

    <rect x="598" y="78" width="178" height="150" rx="10" fill="#191c19"/>
    <text x="618" y="138" font-size="28" font-weight="700" fill="#ffffff">通数</text>
    <text x="618" y="182" font-size="22" fill="#ffffff">月の合計で</text>
    <text x="618" y="212" font-size="22" fill="#ffffff">プランと比べる</text>

    <rect x="24" y="258" width="752" height="130" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
    <text x="44" y="302" font-size="24" font-weight="700" fill="#806222">例（仮定）：友だち300人に月4回配信</text>
    <text x="44" y="352" font-size="26" fill="#191c19">300人 × 4回 ＝ 1,200通 → ライトプランの範囲</text>
  </g>
</svg>
