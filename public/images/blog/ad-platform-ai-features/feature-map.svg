<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="650" fill="#f7f7f4"/>
