<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="640" fill="#f7f7f4"/>
  <g>
    <rect x="20" y="15" width="760" height="90" rx="12" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
    <circle cx="70" cy="60" r="28" fill="#c9a84c"/><text x="70" y="69" text-anchor="middle" font-size="26" font-weight="bold" fill="#191c19">1</text>
    <text x="120" y="52" font-size="26" font-weight="bold" fill="#191c19">機能を確かめる</text>
    <text x="120" y="88" font-size="24" fill="#41483c">どの自動生成がオンになっているか</text>
  </g>
  <g>
    <rect x="20" y="118" width="760" height="90" rx="12" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
    <circle cx="70" cy="163" r="28" fill="#c9a84c"/><text x="70" y="172" text-anchor="middle" font-size="26" font-weight="bold" fill="#191c19">2</text>
    <text x="120" y="155" font-size="26" font-weight="bold" fill="#191c19">材料を直す</text>
    <text x="120" y="191" font-size="24" fill="#41483c">LP・既存の広告・店舗の情報を最新に</text>
  </g>
  <g>
    <rect x="20" y="221" width="760" height="90" rx="12" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
    <circle cx="70" cy="266" r="28" fill="#c9a84c"/><text x="70" y="275" text-anchor="middle" font-size="26" font-weight="bold" fill="#191c19">3</text>
    <text x="120" y="258" font-size="26" font-weight="bold" fill="#191c19">生成物を見る</text>
    <text x="120" y="294" font-size="24" fill="#41483c">アセットの詳細・詳細プレビュー</text>
  </g>
  <g>
    <rect x="20" y="324" width="760" height="90" rx="12" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
    <circle cx="70" cy="369" r="28" fill="#806222"/><text x="70" y="378" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    <text x="120" y="361" font-size="26" font-weight="bold" fill="#191c19">根拠と照らす</text>
    <text x="120" y="397" font-size="24" fill="#41483c">数値・最上級・価格・効果・所在地</text>
  </g>
  <g>
    <rect x="20" y="427" width="760" height="90" rx="12" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
    <circle cx="70" cy="472" r="28" fill="#c9a84c"/><text x="70" y="481" text-anchor="middle" font-size="26" font-weight="bold" fill="#191c19">5</text>
    <text x="120" y="464" font-size="26" font-weight="bold" fill="#191c19">消す・止める</text>
    <text x="120" y="500" font-size="24" fill="#41483c">アセットを個別に削除、または機能をオフ</text>
  </g>
  <g>
    <rect x="20" y="530" width="760" height="90" rx="12" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
    <circle cx="70" cy="575" r="28" fill="#c9a84c"/><text x="70" y="584" text-anchor="middle" font-size="26" font-weight="bold" fill="#191c19">6</text>
    <text x="120" y="567" font-size="26" font-weight="bold" fill="#191c19">繰り返す</text>
    <text x="120" y="603" font-size="24" fill="#41483c">LPや広告を変えたとき・媒体の通知のとき</text>
  </g>
</svg>
