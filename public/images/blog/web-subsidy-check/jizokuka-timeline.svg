<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="960" fill="#f7f7f4"/>
  <text x="40" y="58" font-size="30" font-weight="bold" fill="#191c19">持続化補助金 第20回の日程と発注できる時期</text>
  <line x1="92" y1="110" x2="92" y2="900" stroke="#c9a84c" stroke-width="6"/>

  <circle cx="92" cy="130" r="14" fill="#ffffff" stroke="#806222" stroke-width="5"/>
  <rect x="130" y="92" width="630" height="84" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="150" y="126" font-size="24" font-weight="bold" fill="#191c19">2026年12月4日（金）</text>
  <text x="150" y="160" font-size="24" fill="#41483c">事業支援計画書（様式4）の発行受付締切</text>

  <circle cx="92" cy="240" r="14" fill="#ffffff" stroke="#806222" stroke-width="5"/>
  <rect x="130" y="202" width="630" height="84" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="150" y="236" font-size="24" font-weight="bold" fill="#191c19">2026年12月15日（火）17:00</text>
  <text x="150" y="270" font-size="24" fill="#41483c">申請受付締切（電子申請のみ）</text>

  <circle cx="92" cy="350" r="14" fill="#ffffff" stroke="#806222" stroke-width="5"/>
  <rect x="130" y="312" width="630" height="84" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="150" y="346" font-size="24" font-weight="bold" fill="#191c19">2027年3月頃（予定）</text>
  <text x="150" y="380" font-size="24" fill="#41483c">採択発表 → 見積書等を提出</text>

  <rect x="130" y="414" width="630" height="44" rx="8" fill="#fbf3dd"/>
  <text x="150" y="444" font-size="24" fill="#806222">ここまでに発注・契約した経費は対象外</text>

  <circle cx="92" cy="514" r="16" fill="#806222"/>
  <rect x="130" y="476" width="630" height="120" rx="10" fill="#ffffff" stroke="#806222" stroke-width="4"/>
  <text x="150" y="512" font-size="24" font-weight="bold" fill="#191c19">交付決定（採択発表から概ね1〜2か月）</text>
  <text x="150" y="546" font-size="24" fill="#41483c">この日から制作会社・広告の</text>
  <text x="150" y="580" font-size="24" fill="#41483c">発注・契約・支払いができる</text>

  <circle cx="92" cy="660" r="14" fill="#ffffff" stroke="#806222" stroke-width="5"/>
  <rect x="130" y="622" width="630" height="120" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="150" y="656" font-size="24" font-weight="bold" fill="#191c19">2028年3月31日（金）まで</text>
  <text x="150" y="690" font-size="24" fill="#41483c">補助事業の実施期間。ホームページの</text>
  <text x="150" y="724" font-size="24" fill="#41483c">公開と支払いをこの中で終える</text>

  <circle cx="92" cy="806" r="14" fill="#ffffff" stroke="#806222" stroke-width="5"/>
  <rect x="130" y="768" width="630" height="120" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="150" y="802" font-size="24" font-weight="bold" fill="#191c19">実績報告 → 額の確定 → 入金</text>
  <text x="150" y="836" font-size="24" fill="#41483c">補助金は後払い。それまでは</text>
  <text x="150" y="870" font-size="24" fill="#41483c">全額を自社で立て替える</text>

  <text x="40" y="938" font-size="22" fill="#41483c">日程は商工会議所地区事務局の第20回の案内（予定は変更あり）</text>
</svg>
