<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="560" fill="#f7f7f4"/>
  <rect x="30" y="24" width="430" height="64" rx="12" fill="#c9a84c"/>
  <text x="245" y="66" font-size="26" font-weight="700" fill="#191c19" text-anchor="middle">達すると配信が止まる金額</text>
  <rect x="480" y="24" width="290" height="64" rx="12" fill="#191c19"/>
  <text x="625" y="66" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">請求の時期を決める</text>
  <g stroke="#e3e2dc" stroke-width="2" fill="#ffffff">
    <rect x="30" y="104" width="430" height="64" rx="10"/>
    <rect x="30" y="180" width="430" height="64" rx="10"/>
    <rect x="30" y="256" width="430" height="64" rx="10"/>
    <rect x="30" y="332" width="430" height="64" rx="10"/>
    <rect x="30" y="408" width="430" height="64" rx="10"/>
    <rect x="480" y="104" width="290" height="140" rx="10"/>
    <rect x="480" y="256" width="290" height="140" rx="10"/>
  </g>
  <g font-size="24" fill="#191c19" text-anchor="middle">
    <text x="245" y="145">通算予算（広告セット等）</text>
    <text x="245" y="221">キャンペーンの上限予算</text>
    <text x="245" y="297">広告アカウントの上限予算</text>
    <text x="245" y="373">1日の上限予算（Metaが設定）</text>
    <text x="245" y="449">利用可能残高（前払いの資金）</text>
    <text x="625" y="166" font-weight="700">支払い単位額</text>
    <text x="625" y="202">達しても配信は続く</text>
    <text x="625" y="318" font-weight="700">毎月の請求日</text>
    <text x="625" y="354">残りの料金を請求</text>
  </g>
  <text x="400" y="516" font-size="24" fill="#806222" text-anchor="middle">1日の予算は1日の平均で、超えてはならない上限ではない</text>
</svg>
