<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#806222"/>
    </marker>
  </defs>
  <rect x="30" y="20" width="740" height="96" rx="8" fill="#f7f7f4" stroke="#c9a84c" stroke-width="2"/>
  <text x="400" y="60" font-size="24" font-weight="bold" text-anchor="middle" fill="#191c19">Q1 広告経由の成果（問い合わせ・購入など）を</text>
  <text x="400" y="96" font-size="24" font-weight="bold" text-anchor="middle" fill="#191c19">正しく数えられるか</text>
  <line x1="215" y1="116" x2="215" y2="144" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>
  <line x1="585" y1="116" x2="585" y2="144" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>
  <rect x="30" y="150" width="370" height="96" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="215" y="190" font-size="24" text-anchor="middle" fill="#806222" font-weight="bold">はい：成果報酬型も比べる</text>
  <text x="215" y="226" font-size="22" text-anchor="middle" fill="#41483c">（成果の定義を契約で決める）</text>
  <rect x="410" y="150" width="360" height="96" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="590" y="190" font-size="24" text-anchor="middle" fill="#806222" font-weight="bold">いいえ：成果報酬型は外す</text>
  <text x="590" y="226" font-size="22" text-anchor="middle" fill="#41483c">（請求額を検算できない）</text>
  <line x1="400" y1="250" x2="400" y2="280" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>
  <text x="420" y="274" font-size="22" fill="#41483c">どちらも次へ</text>
  <rect x="30" y="286" width="740" height="70" rx="8" fill="#f7f7f4" stroke="#c9a84c" stroke-width="2"/>
  <text x="400" y="330" font-size="24" font-weight="bold" text-anchor="middle" fill="#191c19">Q2 広告費を月ごとに増減させる予定か</text>
  <line x1="215" y1="356" x2="215" y2="384" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>
  <line x1="585" y1="356" x2="585" y2="384" stroke="#806222" stroke-width="3" marker-end="url(#arw)"/>
  <rect x="30" y="390" width="370" height="100" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="215" y="430" font-size="24" text-anchor="middle" fill="#806222" font-weight="bold">はい：広告費連動型</text>
  <text x="215" y="468" font-size="22" text-anchor="middle" fill="#41483c">計算のもと・最低手数料を確認</text>
  <rect x="410" y="390" width="360" height="100" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="590" y="430" font-size="24" text-anchor="middle" fill="#806222" font-weight="bold">いいえ：定額型</text>
  <text x="590" y="468" font-size="22" text-anchor="middle" fill="#41483c">作業範囲と超えた分の料金を確認</text>
</svg>
