<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect x="0" y="0" width="800" height="400" fill="#f7f7f4"/>
  <text x="30" y="56" font-size="24" fill="#191c19" font-weight="bold">グラフの合計クリック数 550（公式ブログの例）</text>
  <rect x="30" y="80" width="740" height="70" rx="6" fill="#806222"/>
  <text x="400" y="125" font-size="26" fill="#ffffff" font-weight="bold" text-anchor="middle">550</text>
  <text x="30" y="210" font-size="24" fill="#191c19" font-weight="bold">表に出るクエリの合計と、出ないクエリ</text>
  <rect x="30" y="234" width="605" height="70" rx="6" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="332" y="279" font-size="24" fill="#806222" font-weight="bold" text-anchor="middle">表の4クエリ 450</text>
  <rect x="640" y="234" width="130" height="70" rx="6" fill="#e3e2dc"/>
  <text x="705" y="279" font-size="24" fill="#191c19" font-weight="bold" text-anchor="middle">100</text>
  <text x="770" y="342" font-size="22" fill="#41483c" text-anchor="end">差の100＝匿名化されたクエリ</text>
  <text x="770" y="376" font-size="22" fill="#41483c" text-anchor="end">（2〜3か月で数十人以下の検索語）</text>
</svg>
