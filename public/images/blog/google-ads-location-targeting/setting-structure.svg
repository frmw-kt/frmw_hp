<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="560" fill="#f7f7f4"/>
  <text x="400" y="48" text-anchor="middle" font-size="28" font-weight="bold" fill="#191c19">商圏に絞る3つの設定と配信後の確認</text>
  <rect x="60" y="80" width="680" height="96" rx="12" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="90" y="120" font-size="26" font-weight="bold" fill="#806222">① 範囲を指定する</text>
  <text x="90" y="156" font-size="24" fill="#41483c">都道府県・市区町村などの区域、または半径1km以上</text>
  <rect x="60" y="196" width="680" height="96" rx="12" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="90" y="236" font-size="26" font-weight="bold" fill="#806222">② 地域オプションを選ぶ</text>
  <text x="90" y="272" font-size="24" fill="#41483c">「所在地やインタレスト」（初期設定）か「所在地」</text>
  <rect x="60" y="312" width="680" height="96" rx="12" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="90" y="352" font-size="26" font-weight="bold" fill="#806222">③ 除外地域を足す</text>
  <text x="90" y="388" font-size="24" fill="#41483c">除外は、その地域にいる人で判定される</text>
  <rect x="60" y="440" width="680" height="96" rx="12" fill="#191c19"/>
  <text x="90" y="480" font-size="26" font-weight="bold" fill="#ffffff">④ 配信後：地域レポートで確かめる</text>
  <text x="90" y="516" font-size="24" fill="#e3e2dc">「一致した地域」で商圏外の表示と費用を見る</text>
  <path d="M760 488 H780 V128 H748" fill="none" stroke="#806222" stroke-width="3"/>
  <path d="M748 128 l12 -8 v16 z" fill="#806222"/>
</svg>
