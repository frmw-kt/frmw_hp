<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="440" fill="#f7f7f4"/>
  <text x="400" y="48" text-anchor="middle" font-size="28" font-weight="bold" fill="#191c19">入札単価調整は掛け合わせて計算する</text>
  <rect x="24" y="90" width="232" height="120" rx="12" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="140" y="138" text-anchor="middle" font-size="24" fill="#41483c">上限クリック単価</text>
  <text x="140" y="182" text-anchor="middle" font-size="30" font-weight="bold" fill="#191c19">100円</text>
  <text x="270" y="164" text-anchor="middle" font-size="32" fill="#191c19">×</text>
  <rect x="284" y="90" width="210" height="120" rx="12" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="389" y="138" text-anchor="middle" font-size="24" fill="#41483c">大阪 +20%</text>
  <text x="389" y="182" text-anchor="middle" font-size="30" font-weight="bold" fill="#191c19">1.2</text>
  <text x="516" y="164" text-anchor="middle" font-size="32" fill="#191c19">×</text>
  <rect x="538" y="90" width="222" height="120" rx="12" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="649" y="138" text-anchor="middle" font-size="24" fill="#41483c">土曜 −50%</text>
  <text x="649" y="182" text-anchor="middle" font-size="30" font-weight="bold" fill="#191c19">0.5</text>
  <rect x="200" y="250" width="400" height="90" rx="12" fill="#191c19"/>
  <text x="400" y="308" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">土曜の大阪：60円</text>
  <text x="400" y="392" text-anchor="middle" font-size="24" fill="#41483c">地域の調整は−90%〜+900%（キャンペーン単位）</text>
  <text x="400" y="426" text-anchor="middle" font-size="22" fill="#41483c">スマート自動入札では手動の調整は使われない</text>
