<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" width="800" height="660" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="660" rx="16" fill="#f7f7f4"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#191c19">実績のCPAが、どの範囲にあるかで判断する</text>

  <!-- CPAの範囲 -->
  <rect x="40" y="70" width="240" height="60" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <rect x="280" y="70" width="240" height="60" fill="#c9a84c"/>
  <rect x="520" y="70" width="240" height="60" fill="#191c19"/>
  <text x="160" y="109" font-size="24" text-anchor="middle" fill="#41483c">利益が残る</text>
  <text x="400" y="109" font-size="24" text-anchor="middle" fill="#191c19">利益が目標未満</text>
  <text x="640" y="109" font-size="24" text-anchor="middle" fill="#ffffff">赤字</text>
  <line x1="280" y1="62" x2="280" y2="140" stroke="#806222" stroke-width="3"/>
  <line x1="520" y1="62" x2="520" y2="140" stroke="#806222" stroke-width="3"/>
  <text x="280" y="166" font-size="22" text-anchor="middle" fill="#191c19">許容CPA1.5万円</text>
  <text x="520" y="166" font-size="22" text-anchor="middle" fill="#191c19">限界CPA3万円</text>

  <!-- 判断1 -->
  <rect x="40" y="196" width="720" height="118" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <rect x="40" y="196" width="14" height="118" fill="#e3e2dc"/>
  <text x="72" y="230" font-size="24" font-weight="700" fill="#191c19">許容CPA以下：予算を増やす候補</text>
  <text x="72" y="264" font-size="24" fill="#41483c">予算を少しずつ増やし、増やした後の</text>
  <text x="72" y="296" font-size="24" fill="#41483c">CPAも許容CPA以下に収まるか確かめる</text>

  <!-- 判断2 -->
  <rect x="40" y="326" width="720" height="118" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <rect x="40" y="326" width="14" height="118" fill="#c9a84c"/>
  <text x="72" y="360" font-size="24" font-weight="700" fill="#191c19">許容CPA〜限界CPA：利益が目標に届かない</text>
  <text x="72" y="394" font-size="24" fill="#41483c">予算を増やす前に、広告の内容・配信の対象・</text>
  <text x="72" y="426" font-size="24" fill="#41483c">リンク先のページを見直す</text>

  <!-- 判断3 -->
  <rect x="40" y="456" width="720" height="118" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <rect x="40" y="456" width="14" height="118" fill="#191c19"/>
  <text x="72" y="490" font-size="24" font-weight="700" fill="#191c19">限界CPA超：広告費が粗利を上回る</text>
  <text x="72" y="524" font-size="24" fill="#41483c">予算を増やさず、広告に加えて商談化率・</text>
  <text x="72" y="556" font-size="24" fill="#41483c">成約率が下がっていないかを確かめる</text>

  <text x="40" y="610" font-size="22" fill="#41483c">許容CPA・限界CPAは実績の商談化率・成約率で計算し直す</text>
  <text x="40" y="642" font-size="22" fill="#41483c">金額は試算の仮定（問い合わせ型）</text>
</svg>
