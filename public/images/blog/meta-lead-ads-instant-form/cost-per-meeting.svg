<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="640" fill="#f7f7f4"/>
  <rect x="20" y="20" width="760" height="56" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="400" y="58" font-size="26" font-weight="700" fill="#191c19" text-anchor="middle">月の広告費10万円（仮定）を同じに置いて比べる</text>
  <g stroke="#e3e2dc" stroke-width="2" fill="#ffffff">
    <rect x="20" y="96" width="370" height="380" rx="12"/>
    <rect x="410" y="96" width="370" height="380" rx="12"/>
  </g>
  <g font-size="28" font-weight="700" fill="#806222" text-anchor="middle">
    <text x="205" y="140">インスタントフォーム</text>
    <text x="595" y="140">LP</text>
  </g>
  <g stroke="#e3e2dc" stroke-width="2">
    <line x1="40" y1="160" x2="370" y2="160"/>
    <line x1="430" y1="160" x2="760" y2="160"/>
    <line x1="40" y1="400" x2="370" y2="400"/>
    <line x1="430" y1="400" x2="760" y2="400"/>
  </g>
  <g font-size="24" fill="#41483c">
    <text x="44" y="204">リード単価</text>
    <text x="44" y="256">リード数</text>
    <text x="44" y="308">商談化率</text>
    <text x="44" y="360">商談数</text>
    <text x="434" y="204">リード単価</text>
    <text x="434" y="256">リード数</text>
    <text x="434" y="308">商談化率</text>
    <text x="434" y="360">商談数</text>
  </g>
  <g font-size="26" font-weight="700" fill="#191c19" text-anchor="end">
    <text x="366" y="204">2,000円</text>
    <text x="366" y="256">50件</text>
    <text x="366" y="308">10%</text>
    <text x="366" y="360">5件</text>
    <text x="756" y="204">5,000円</text>
    <text x="756" y="256">20件</text>
    <text x="756" y="308">30%</text>
    <text x="756" y="360">6件</text>
  </g>
  <g font-size="24" font-weight="700" fill="#806222">
    <text x="44" y="446">商談1件あたり</text>
    <text x="434" y="446">商談1件あたり</text>
  </g>
  <g font-size="28" font-weight="700" fill="#806222" text-anchor="end">
    <text x="366" y="446">2万円</text>
    <text x="756" y="446">約1.7万円</text>
  </g>
  <rect x="20" y="496" width="760" height="124" rx="12" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <g font-size="24" fill="#191c19" text-anchor="middle">
    <text x="400" y="536">商談1件あたりの費用 ＝ リード単価 ÷ 商談化率</text>
    <text x="400" y="572">分岐点：2,000円 ÷ 約16,667円 ＝ 商談化率12%</text>
  </g>
  <text x="400" y="606" font-size="22" fill="#41483c" text-anchor="middle">数値はすべて仮定（実在の事例ではありません）</text>
</svg>
