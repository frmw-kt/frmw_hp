<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="640" fill="#f7f7f4"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#806222"/>
    </marker>
  </defs>
  <g fill="none" stroke="#806222" stroke-width="3" marker-end="url(#arrow)">
    <line x1="400" y1="128" x2="400" y2="160"/>
    <line x1="400" y1="288" x2="400" y2="320"/>
    <line x1="400" y1="448" x2="400" y2="480"/>
  </g>
  <g stroke="#c9a84c" stroke-width="3" fill="#ffffff">
    <rect x="40" y="20" width="720" height="108" rx="12"/>
    <rect x="40" y="324" width="720" height="124" rx="12"/>
  </g>
  <g stroke="#806222" stroke-width="3" fill="#ffffff">
    <rect x="40" y="164" width="720" height="124" rx="12"/>
    <rect x="40" y="484" width="720" height="136" rx="12"/>
  </g>
  <g font-size="26" font-weight="700" fill="#191c19" text-anchor="middle">
    <text x="400" y="62">1. 「宣伝」で反応のよい投稿を見つける</text>
    <text x="400" y="206">2. 広告マネージャで使う準備をする</text>
    <text x="400" y="366">3. 目的を選び、既存の投稿を広告にする</text>
    <text x="400" y="526">4. 1週間ほど待ってから結果を見る</text>
  </g>
  <g font-size="22" fill="#41483c" text-anchor="middle">
    <text x="400" y="104">インサイトで、目標にした行動が多い投稿</text>
    <text x="400" y="244">Facebookページの連携・広告アカウント・</text>
    <text x="400" y="274">支払い方法・Metaピクセル（完了ページ）</text>
    <text x="400" y="404">リードや売上を選び、広告設定で</text>
    <text x="400" y="434">［既存の投稿を使用］を選ぶ</text>
    <text x="400" y="566">最後の大幅な編集から1週間以内に約50件が</text>
    <text x="400" y="598">情報収集期間を終える目安</text>
  </g>
</svg>
