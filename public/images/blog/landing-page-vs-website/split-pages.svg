<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="480" fill="#f7f7f4"/>
  <text x="400" y="44" font-size="24" fill="#191c19" text-anchor="middle">月の広告費10万円・1クリック100円・問い合わせ率2%</text>
  <text x="400" y="78" font-size="22" fill="#806222" text-anchor="middle">（数値はすべて仮定。均等に分けた場合）</text>
  <!-- header -->
  <rect x="30" y="100" width="740" height="80" fill="#191c19"/>
  <text x="120" y="150" font-size="24" fill="#ffffff" text-anchor="middle">リンク先</text>
  <text x="330" y="132" font-size="22" fill="#ffffff" text-anchor="middle">1ページの</text>
  <text x="330" y="164" font-size="22" fill="#ffffff" text-anchor="middle">クリック</text>
  <text x="500" y="132" font-size="22" fill="#ffffff" text-anchor="middle">1ページの</text>
  <text x="500" y="164" font-size="22" fill="#ffffff" text-anchor="middle">問い合わせ</text>
  <text x="675" y="132" font-size="22" fill="#ffffff" text-anchor="middle">1件の増減で</text>
  <text x="675" y="164" font-size="22" fill="#ffffff" text-anchor="middle">動く率</text>
  <!-- rows -->
  <rect x="30" y="180" width="740" height="88" fill="#ffffff" stroke="#e3e2dc"/>
  <text x="120" y="234" font-size="26" fill="#191c19" text-anchor="middle">1ページ</text>
  <text x="330" y="234" font-size="26" fill="#191c19" text-anchor="middle">1,000回</text>
  <text x="500" y="234" font-size="26" fill="#191c19" text-anchor="middle">20件</text>
  <text x="675" y="234" font-size="26" fill="#191c19" text-anchor="middle">0.1ポイント</text>
  <rect x="30" y="268" width="740" height="88" fill="#ffffff" stroke="#e3e2dc"/>
  <text x="120" y="322" font-size="26" fill="#191c19" text-anchor="middle">2ページ</text>
  <text x="330" y="322" font-size="26" fill="#191c19" text-anchor="middle">500回</text>
  <text x="500" y="322" font-size="26" fill="#191c19" text-anchor="middle">10件</text>
  <text x="675" y="322" font-size="26" fill="#191c19" text-anchor="middle">0.2ポイント</text>
  <rect x="30" y="356" width="740" height="88" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="120" y="410" font-size="26" fill="#806222" text-anchor="middle">4ページ</text>
  <text x="330" y="410" font-size="26" fill="#806222" text-anchor="middle">250回</text>
  <text x="500" y="410" font-size="26" fill="#806222" text-anchor="middle">5件</text>
  <text x="675" y="410" font-size="26" fill="#806222" text-anchor="middle">0.4ポイント</text>
</svg>
