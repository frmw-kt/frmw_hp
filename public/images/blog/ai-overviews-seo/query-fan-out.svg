<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="620" fill="#f7f7f4"/>
  <text x="400" y="46" font-size="26" font-weight="bold" fill="#191c19" text-anchor="middle">AIが回答を組み立てる流れ（Google公式の例）</text>
  <rect x="40" y="70" width="720" height="68" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="400" y="113" font-size="24" fill="#191c19" text-anchor="middle">質問：雑草だらけの芝生を直す方法</text>
  <path d="M400 142 L400 162 M388 152 L400 164 L412 152" stroke="#806222" stroke-width="3" fill="none"/>
  <text x="400" y="196" font-size="24" font-weight="bold" fill="#806222" text-anchor="middle">関連する検索を同時に実行（クエリ ファンアウト）</text>
  <rect x="90" y="214" width="620" height="50" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="2"/>
  <text x="400" y="248" font-size="24" fill="#41483c" text-anchor="middle">芝生に最適な除草剤</text>
  <rect x="90" y="272" width="620" height="50" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="2"/>
  <text x="400" y="306" font-size="24" fill="#41483c" text-anchor="middle">化学薬品を使わずに雑草を除去する方法</text>
  <rect x="90" y="330" width="620" height="50" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="2"/>
  <text x="400" y="364" font-size="24" fill="#41483c" text-anchor="middle">芝生の雑草を防ぐ方法</text>
  <path d="M400 386 L400 406 M388 396 L400 408 L412 396" stroke="#806222" stroke-width="3" fill="none"/>
  <rect x="40" y="412" width="720" height="92" rx="10" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="400" y="450" font-size="24" fill="#191c19" text-anchor="middle">検索インデックスから関連ページを取得</text>
  <text x="400" y="486" font-size="22" fill="#41483c" text-anchor="middle">（コア ランキング システムを利用）</text>
  <path d="M400 508 L400 528 M388 518 L400 530 L412 518" stroke="#806222" stroke-width="3" fill="none"/>
  <rect x="40" y="534" width="720" height="66" rx="10" fill="#c9a84c"/>
  <text x="400" y="576" font-size="24" font-weight="bold" fill="#191c19" text-anchor="middle">AIの回答＋根拠になったページへのリンク</text>
</svg>
