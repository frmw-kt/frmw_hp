<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect x="180" y="30" width="440" height="70" rx="8" fill="#191c19"/>
  <text x="400" y="75" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">今の広告アカウントの状態は？</text>
  <g stroke="#c9a84c" stroke-width="3" fill="none">
    <path d="M400 100 V130 H140 V165"/>
    <path d="M400 130 V165"/>
    <path d="M400 130 H660 V165"/>
  </g>
  <g>
    <rect x="20" y="170" width="240" height="150" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
    <text x="140" y="215" font-size="26" font-weight="bold" fill="#806222" text-anchor="middle">まだない</text>
    <text x="140" y="260" font-size="24" fill="#41483c" text-anchor="middle">自社名義で</text>
    <text x="140" y="295" font-size="24" fill="#41483c" text-anchor="middle">新しく作る</text>
  </g>
  <g>
    <rect x="280" y="170" width="240" height="150" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
    <text x="400" y="215" font-size="26" font-weight="bold" fill="#806222" text-anchor="middle">自社にある</text>
    <text x="400" y="260" font-size="24" fill="#41483c" text-anchor="middle">自社に管理者が</text>
    <text x="400" y="295" font-size="24" fill="#41483c" text-anchor="middle">いる</text>
  </g>
  <g>
    <rect x="540" y="170" width="240" height="150" rx="8" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
    <text x="660" y="215" font-size="24" font-weight="bold" fill="#806222" text-anchor="middle">前の代理店などが</text>
    <text x="660" y="250" font-size="24" font-weight="bold" fill="#806222" text-anchor="middle">持っている</text>
    <text x="660" y="295" font-size="24" fill="#41483c" text-anchor="middle">自社に管理者がない</text>
  </g>
  <g stroke="#c9a84c" stroke-width="3" fill="none">
    <path d="M140 320 V375"/>
    <path d="M400 320 V375"/>
    <path d="M660 320 V375"/>
  </g>
  <polygon points="130,372 150,372 140,385" fill="#c9a84c"/>
  <polygon points="390,372 410,372 400,385" fill="#c9a84c"/>
  <polygon points="650,372 670,372 660,385" fill="#c9a84c"/>
  <rect x="20" y="390" width="500" height="130" rx="8" fill="#191c19"/>
  <text x="270" y="445" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">代理店に必要な権限を渡す</text>
  <text x="270" y="485" font-size="24" fill="#ffffff" text-anchor="middle">（渡し方は図3）</text>
  <rect x="540" y="390" width="240" height="130" rx="8" fill="#806222"/>
  <text x="660" y="440" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">自社の管理者を</text>
  <text x="660" y="475" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">確保してから渡す</text>
  <text x="660" y="508" font-size="22" fill="#ffffff" text-anchor="middle">（乗り換えの手順）</text>
</svg>
