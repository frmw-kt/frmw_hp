<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <title>広告運用レポートの作り方（自作・代行・自動化）を選ぶ分岐</title>
  <desc>広告の運用そのものを外注するなら、運用代行にレポートも含めて任せる。自社で運用していて媒体が1つなら管理画面の定期メール、2つ以上ならデータポータルで自作する。書き出しや商談・成約との突き合わせに毎月時間がかかっているなら、集計の自動化を検討する。どの作り方でも、商談・成約の数は自社の記録から入れる。</desc>
  <rect width="800" height="520" fill="#ffffff"/>

  <rect x="16" y="16" width="400" height="84" rx="10" fill="#191c19"/>
  <text x="216" y="67" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">運用そのものを外注する？</text>
  <path d="M418 58 L462 58" stroke="#c9a84c" stroke-width="4"/>
  <path d="M458 48 L470 58 L458 68 Z" fill="#c9a84c"/>
  <text x="440" y="44" font-size="22" font-weight="700" fill="#806222" text-anchor="middle">はい</text>
  <rect x="474" y="16" width="310" height="84" rx="10" fill="#806222"/>
  <text x="629" y="52" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">運用代行に</text>
  <text x="629" y="84" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">レポートも任せる</text>

  <path d="M216 102 L216 140" stroke="#c9a84c" stroke-width="4"/>
  <path d="M206 136 L216 148 L226 136 Z" fill="#c9a84c"/>
  <text x="240" y="132" font-size="22" font-weight="700" fill="#806222">いいえ</text>

  <rect x="16" y="150" width="400" height="84" rx="10" fill="#191c19"/>
  <text x="216" y="201" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">媒体はいくつか？</text>
  <path d="M418 180 L462 160" stroke="#c9a84c" stroke-width="4"/>
  <path d="M418 204 L462 236" stroke="#c9a84c" stroke-width="4"/>
  <rect x="474" y="118" width="310" height="80" rx="10" fill="#c9a84c"/>
  <text x="629" y="150" font-size="22" font-weight="700" fill="#191c19" text-anchor="middle">1つ</text>
  <text x="629" y="182" font-size="22" fill="#191c19" text-anchor="middle">管理画面の定期メール</text>
  <rect x="474" y="208" width="310" height="80" rx="10" fill="#c9a84c"/>
  <text x="629" y="240" font-size="22" font-weight="700" fill="#191c19" text-anchor="middle">2つ以上</text>
  <text x="629" y="272" font-size="22" fill="#191c19" text-anchor="middle">データポータルで自作</text>

  <path d="M216 236 L216 300" stroke="#c9a84c" stroke-width="4"/>
  <path d="M206 296 L216 308 L226 296 Z" fill="#c9a84c"/>
  <text x="240" y="280" font-size="22" fill="#41483c">作ったうえで</text>

  <rect x="16" y="310" width="400" height="110" rx="10" fill="#191c19"/>
  <text x="216" y="354" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">書き出し・突き合わせに</text>
  <text x="216" y="390" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">毎月時間がかかる？</text>
  <path d="M418 365 L462 365" stroke="#c9a84c" stroke-width="4"/>
  <path d="M458 355 L470 365 L458 375 Z" fill="#c9a84c"/>
  <text x="440" y="350" font-size="22" font-weight="700" fill="#806222" text-anchor="middle">はい</text>
  <rect x="474" y="323" width="310" height="84" rx="10" fill="#806222"/>
  <text x="629" y="359" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">集計の自動化を</text>
  <text x="629" y="391" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">検討する</text>

  <rect x="16" y="446" width="768" height="60" rx="10" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="400" y="484" font-size="22" fill="#41483c" text-anchor="middle">どの作り方でも、商談・成約の数は自社の記録から入れる</text>
</svg>
