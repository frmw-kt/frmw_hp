<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <title>広告運用レポートの4段と数字の出どころ</title>
  <desc>1段目は費用と配信（費用・表示回数・クリック数）、2段目は成果と単価（コンバージョンまたは結果、成果1件あたりの費用）で、どちらも媒体の管理画面から出す。3段目は商談・成約で自社の顧客管理や台帳から出す。4段目は前の期間との比較と次に変えることで、レポートの作り手が書く。</desc>
  <rect width="800" height="500" fill="#ffffff"/>

  <rect x="16" y="16" width="190" height="104" rx="10" fill="#c9a84c"/>
  <text x="111" y="60" font-size="26" font-weight="700" fill="#191c19" text-anchor="middle">1 費用と</text>
  <text x="111" y="94" font-size="26" font-weight="700" fill="#191c19" text-anchor="middle">配信</text>
  <rect x="220" y="16" width="564" height="104" rx="10" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="240" y="58" font-size="24" font-weight="700" fill="#191c19">費用・表示回数・クリック数</text>
  <text x="240" y="96" font-size="22" fill="#41483c">出どころ：媒体の管理画面</text>

  <rect x="16" y="136" width="190" height="104" rx="10" fill="#c9a84c"/>
  <text x="111" y="180" font-size="26" font-weight="700" fill="#191c19" text-anchor="middle">2 成果と</text>
  <text x="111" y="214" font-size="26" font-weight="700" fill="#191c19" text-anchor="middle">単価</text>
  <rect x="220" y="136" width="564" height="104" rx="10" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="240" y="178" font-size="24" font-weight="700" fill="#191c19">成果の件数（Metaは「結果」）・単価</text>
  <text x="240" y="216" font-size="22" fill="#41483c">出どころ：媒体の管理画面</text>

  <rect x="16" y="256" width="190" height="104" rx="10" fill="#806222"/>
  <text x="111" y="300" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">3 商談・</text>
  <text x="111" y="334" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">成約</text>
  <rect x="220" y="256" width="564" height="104" rx="10" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="240" y="298" font-size="24" font-weight="700" fill="#191c19">商談数・成約数・1件あたりの広告費</text>
  <text x="240" y="336" font-size="22" fill="#41483c">出どころ：自社の顧客管理・台帳</text>

  <rect x="16" y="376" width="190" height="104" rx="10" fill="#41483c"/>
  <text x="111" y="420" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">4 比較と</text>
  <text x="111" y="454" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">次の行動</text>
  <rect x="220" y="376" width="564" height="104" rx="10" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="240" y="418" font-size="24" font-weight="700" fill="#191c19">前の期間との差・変えたこと・次の手</text>
  <text x="240" y="456" font-size="22" fill="#41483c">書く人：レポートの作り手</text>
</svg>
