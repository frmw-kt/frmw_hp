<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <title>データポータルで媒体の数字と商談・成約を1枚にまとめる構成</title>
  <desc>Google広告はGoogle 広告コネクタで直接つなぐ（12時間ごとに更新）。Meta広告はGoogleのコネクタの一覧にないため、広告レポートから書き出したファイルをGoogle スプレッドシートに置く。商談・成約の記録もスプレッドシートに置き、スプレッドシートのコネクタでつなぐ（既定は15分ごとに更新）。データポータルで日付やキャンペーン名を結合の条件にして統合し（最大5つ）、PDFを定期配信する。</desc>
  <rect width="800" height="500" fill="#ffffff"/>

  <rect x="16" y="30" width="230" height="90" rx="10" fill="#c9a84c"/>
  <text x="131" y="84" font-size="24" font-weight="700" fill="#191c19" text-anchor="middle">Google広告</text>

  <rect x="16" y="170" width="230" height="90" rx="10" fill="#c9a84c"/>
  <text x="131" y="208" font-size="24" font-weight="700" fill="#191c19" text-anchor="middle">Meta広告</text>
  <text x="131" y="240" font-size="22" fill="#191c19" text-anchor="middle">書き出したファイル</text>

  <rect x="16" y="300" width="230" height="90" rx="10" fill="#806222"/>
  <text x="131" y="338" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">商談・成約</text>
  <text x="131" y="370" font-size="22" fill="#ffffff" text-anchor="middle">顧客管理・台帳</text>

  <path d="M248 75 L276 75" stroke="#c9a84c" stroke-width="4"/>
  <path d="M272 65 L284 75 L272 85 Z" fill="#c9a84c"/>
  <path d="M248 215 L276 215" stroke="#c9a84c" stroke-width="4"/>
  <path d="M272 205 L284 215 L272 225 Z" fill="#c9a84c"/>
  <path d="M248 345 L276 345" stroke="#c9a84c" stroke-width="4"/>
  <path d="M272 335 L284 345 L272 355 Z" fill="#c9a84c"/>

  <rect x="288" y="30" width="214" height="90" rx="10" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="395" y="66" font-size="22" font-weight="700" fill="#191c19" text-anchor="middle">Google 広告</text>
  <text x="395" y="100" font-size="22" fill="#41483c" text-anchor="middle">コネクタ</text>

  <rect x="288" y="170" width="214" height="220" rx="10" fill="#f7f7f4" stroke="#e3e2dc" stroke-width="2"/>
  <text x="395" y="250" font-size="22" font-weight="700" fill="#191c19" text-anchor="middle">Google</text>
  <text x="395" y="282" font-size="22" font-weight="700" fill="#191c19" text-anchor="middle">スプレッドシート</text>
  <text x="395" y="320" font-size="22" fill="#41483c" text-anchor="middle">経由でつなぐ</text>

  <path d="M504 75 L532 75" stroke="#c9a84c" stroke-width="4"/>
  <path d="M528 65 L540 75 L528 85 Z" fill="#c9a84c"/>
  <path d="M504 280 L532 280" stroke="#c9a84c" stroke-width="4"/>
  <path d="M528 270 L540 280 L528 290 Z" fill="#c9a84c"/>

  <rect x="544" y="30" width="240" height="360" rx="10" fill="#191c19"/>
  <text x="664" y="80" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">データポータル</text>
  <text x="664" y="150" font-size="22" fill="#ffffff" text-anchor="middle">統合（最大5つ）</text>
  <text x="664" y="214" font-size="22" fill="#e3e2dc" text-anchor="middle">結合の条件：</text>
  <text x="664" y="246" font-size="22" fill="#e3e2dc" text-anchor="middle">日付・</text>
  <text x="664" y="278" font-size="22" fill="#e3e2dc" text-anchor="middle">キャンペーン名</text>
  <text x="664" y="350" font-size="22" fill="#c9a84c" text-anchor="middle">1枚のレポート</text>

  <path d="M664 392 L664 406" stroke="#c9a84c" stroke-width="4"/>
  <path d="M654 402 L664 414 L674 402 Z" fill="#c9a84c"/>
  <rect x="544" y="416" width="240" height="70" rx="10" fill="#c9a84c"/>
  <text x="664" y="460" font-size="24" font-weight="700" fill="#191c19" text-anchor="middle">PDFを定期配信</text>

  <text x="16" y="436" font-size="22" fill="#41483c">Meta広告はGoogleのコネクタ一覧にない</text>
  <text x="16" y="472" font-size="22" fill="#41483c">Google広告は12時間ごとに更新</text>
</svg>
