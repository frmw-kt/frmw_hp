<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-label="Web集客の主な方法を、広告費を払って表示する方法と広告費をかけず手間で育てる方法に分け、探している人・まだ探していない人・つながった人のどれに届くかで整理した図">
  <rect width="800" height="620" fill="#f7f7f4"/>
  <g font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
    <rect x="20" y="16" width="372" height="68" rx="8" fill="#191c19"/>
    <text x="206" y="59" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">広告費を払って表示する</text>
    <rect x="408" y="16" width="372" height="68" rx="8" fill="#191c19"/>
    <text x="594" y="59" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">広告費をかけず手間で育てる</text>

    <text x="24" y="124" font-size="24" font-weight="700" fill="#806222">探している人に出す（検索・地図）</text>
    <rect x="20" y="136" width="372" height="120" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
    <text x="206" y="186" font-size="26" font-weight="700" fill="#191c19" text-anchor="middle">検索広告</text>
    <text x="206" y="226" font-size="24" fill="#41483c" text-anchor="middle">クリックされたら課金</text>
    <rect x="408" y="136" width="372" height="120" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="2"/>
    <text x="594" y="186" font-size="26" font-weight="700" fill="#191c19" text-anchor="middle">SEO・MEO</text>
    <text x="594" y="226" font-size="24" fill="#41483c" text-anchor="middle">順位はお金で上げられない</text>

    <text x="24" y="294" font-size="24" font-weight="700" fill="#806222">まだ探していない人に出す（SNS・サイト・動画）</text>
    <rect x="20" y="306" width="372" height="120" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
    <text x="206" y="356" font-size="26" font-weight="700" fill="#191c19" text-anchor="middle">SNS広告・動画広告など</text>
    <text x="206" y="396" font-size="24" fill="#41483c" text-anchor="middle">表示回数などで課金</text>
    <rect x="408" y="306" width="372" height="120" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="2"/>
    <text x="594" y="356" font-size="26" font-weight="700" fill="#191c19" text-anchor="middle">SNS運用（投稿）</text>
    <text x="594" y="396" font-size="24" fill="#41483c" text-anchor="middle">おすすめで新しい人にも</text>

    <text x="24" y="464" font-size="24" font-weight="700" fill="#806222">つながった人に届ける（訪問者・フォロワー・友だち）</text>
    <rect x="20" y="476" width="372" height="120" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
    <text x="206" y="526" font-size="26" font-weight="700" fill="#191c19" text-anchor="middle">過去の訪問者への広告</text>
    <text x="206" y="566" font-size="24" fill="#41483c" text-anchor="middle">ディスプレイ広告など</text>
    <rect x="408" y="476" width="372" height="120" rx="8" fill="#ffffff" stroke="#c9a84c" stroke-width="2"/>
    <text x="594" y="526" font-size="26" font-weight="700" fill="#191c19" text-anchor="middle">LINE公式アカウント</text>
    <text x="594" y="566" font-size="24" fill="#41483c" text-anchor="middle">友だち・フォロワーに配信</text>
  </g>
</svg>
