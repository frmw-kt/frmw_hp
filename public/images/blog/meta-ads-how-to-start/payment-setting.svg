<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="560" fill="#f7f7f4"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#806222"/>
    </marker>
  </defs>
  <rect x="200" y="20" width="400" height="70" rx="12" fill="#ffffff" stroke="#c9a84c" stroke-width="3"/>
  <text x="400" y="64" font-size="26" font-weight="700" fill="#191c19" text-anchor="middle">最初の広告で選ぶ支払い方法</text>
  <g fill="none" stroke="#806222" stroke-width="3" marker-end="url(#arrow)">
    <path d="M300,92 L300,108 L210,108 L210,126"/>
    <path d="M500,92 L500,108 L590,108 L590,126"/>
    <line x1="210" y1="232" x2="210" y2="264"/>
    <line x1="590" y1="232" x2="590" y2="264"/>
    <line x1="210" y1="342" x2="210" y2="374"/>
    <line x1="590" y1="342" x2="590" y2="374"/>
  </g>
  <g stroke="#e3e2dc" stroke-width="2" fill="#ffffff">
    <rect x="30" y="130" width="360" height="100" rx="12"/>
    <rect x="410" y="130" width="360" height="100" rx="12"/>
    <rect x="30" y="378" width="360" height="100" rx="12"/>
    <rect x="410" y="378" width="360" height="100" rx="12"/>
  </g>
  <g fill="#c9a84c">
    <rect x="30" y="268" width="360" height="72" rx="12"/>
    <rect x="410" y="268" width="360" height="72" rx="12"/>
  </g>
  <g font-size="24" fill="#41483c" text-anchor="middle">
    <text x="210" y="190">クレジットカード・PayPal</text>
    <text x="590" y="172">手動決済方法</text>
    <text x="590" y="208">（日本・日本円の場合）</text>
    <text x="210" y="420">支払い単位額に達した時点</text>
    <text x="210" y="456">か毎月の請求日に請求</text>
    <text x="590" y="420">入金した残高から</text>
    <text x="590" y="456">広告費が使われる</text>
  </g>
  <g font-size="28" font-weight="700" fill="#191c19" text-anchor="middle">
    <text x="210" y="314">自動決済</text>
    <text x="590" y="314">利用可能残高</text>
  </g>
  <text x="400" y="530" font-size="24" fill="#191c19" text-anchor="middle">選んだ設定に固定される場合がある</text>
</svg>
