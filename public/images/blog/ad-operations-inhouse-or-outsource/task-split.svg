<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
  <rect width="800" height="640" fill="#ffffff"/>
  <text x="400" y="42" font-size="26" font-weight="bold" text-anchor="middle" fill="#191c19">広告運用の5つの作業と、任せられる範囲</text>

  <rect x="20" y="70" width="560" height="96" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="44" y="110" font-size="24" font-weight="bold" fill="#191c19">1 設計</text>
  <text x="44" y="146" font-size="22" fill="#41483c">目的・予算・成果の定義を決める</text>

  <rect x="20" y="180" width="560" height="96" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="44" y="220" font-size="24" font-weight="bold" fill="#191c19">2 計測の設定</text>
  <text x="44" y="256" font-size="22" fill="#41483c">タグ・コンバージョンを設定する</text>

  <rect x="20" y="290" width="560" height="96" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="44" y="330" font-size="24" font-weight="bold" fill="#191c19">3 入稿と制作</text>
  <text x="44" y="366" font-size="22" fill="#41483c">広告文・バナー・動画・LPを作る</text>

  <rect x="20" y="400" width="560" height="96" rx="8" fill="#ffffff" stroke="#e3e2dc" stroke-width="2"/>
  <text x="44" y="440" font-size="24" font-weight="bold" fill="#191c19">4 確認と改善の判断</text>
  <text x="44" y="476" font-size="22" fill="#41483c">結果を見て、次の変更を決める</text>

  <rect x="600" y="70" width="180" height="426" rx="8" fill="#f7f7f4" stroke="#c9a84c" stroke-width="2"/>
  <text x="690" y="250" font-size="24" font-weight="bold" text-anchor="middle" fill="#806222">外注</text>
  <text x="690" y="284" font-size="24" font-weight="bold" text-anchor="middle" fill="#806222">できる</text>
  <text x="690" y="324" font-size="22" text-anchor="middle" fill="#41483c">一部だけ</text>
  <text x="690" y="354" font-size="22" text-anchor="middle" fill="#41483c">でもよい</text>

  <rect x="20" y="520" width="760" height="100" rx="8" fill="#191c19"/>
  <text x="44" y="562" font-size="24" font-weight="bold" fill="#ffffff">5 権限の管理・成果の共有・承認</text>
  <text x="44" y="598" font-size="22" fill="#e3e2dc">外注しても社内に残る（管理者・商談と成約の結果）</text>
</svg>
